<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nasdash 2.0 UI Token 预览</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC",-apple-system,"Microsoft YaHei",sans-serif;padding:24px;background:#e9eaee;color:#1d2129}
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .toolbar h1{font-size:18px;font-weight:600}
  .seg{display:inline-flex;border:1px solid #c9cdd4;border-radius:8px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:6px 16px;font-size:14px;cursor:pointer;color:#4e5969}
  .seg button.on{background:#006aff;color:#fff}
  .wrap{display:flex;gap:20px;flex-wrap:wrap}
  .col{flex:1;min-width:320px}
  .h{font-size:13px;color:#86909c;margin:0 0 10px;font-weight:600;letter-spacing:.5px}

  /* light tokens */
  .light{background:#f7f8fa;padding:16px;border-radius:16px}
  .light .card{background:#fff;border:1px solid #e5e6eb;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  /* dark tokens */
  .dark{background:#17171a;padding:16px;border-radius:16px}
  .dark .card{background:#232324;border:1px solid #2e2e30;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}

  .card-title{font-size:16px;font-weight:600;margin:0 0 12px}
  .light .card-title{color:#1d2129}.dark .card-title{color:#f7f8fa}
  .stat{display:flex;gap:24px;margin-bottom:14px}
  .stat-val{font-size:28px;font-weight:600;line-height:1}
  .stat-label{font-size:13px;margin-top:4px}
  .light .stat-val{color:#1d2129}.light .stat-label{color:#86909c}
  .dark .stat-val{color:#f7f8fa}.dark .stat-label{color:#86909c}
  .btns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .btn{border:none;border-radius:6px;padding:7px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  .btn-primary{background:#006aff;color:#fff}.btn-outline{background:transparent;border:1px solid #e5e6eb;color:#4e5969}
  .dark .btn-outline{border-color:#2e2e30;color:#c9cdd4}
  .btn-danger{background:#f53f3f;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;padding:8px 10px;border-bottom:1px solid #e5e6eb;font-weight:500}
  td{padding:8px 10px;border-bottom:1px solid #f2f3f5;color:#4e5969}
  .light th{background:#f2f3f5;color:#86909c}
  .dark th{background:#232324;color:#86909c;border-bottom-color:#2e2e30}
  .dark td{border-bottom-color:#232324;color:#c9cdd4}
  .tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px}
  .tag-s{background:rgba(0,180,42,.12);color:#0a8c20}
  .tag-w{background:rgba(255,125,0,.12);color:#c85a00}
  .tag-i{background:rgba(0,106,255,.12);color:#006aff}
  .rowtab{display:flex;gap:6px;margin-top:14px}
  .tab{flex:1;padding:8px;border-radius:10px;border:none;background:transparent;color:#4e5969;font-size:13px;cursor:pointer;font-family:inherit;text-align:center}
  .tab.on{background:rgba(0,106,255,.10);color:#006aff;font-weight:600}
  .dark .tab{color:#c9cdd4}.dark .tab.on{background:rgba(60,126,255,.14);color:#5c92ff}
  .pal{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}
</style>
</head>
<body>
  <div class="toolbar">
    <h1>nasdash 2.0 UI · Token 预览</h1>
    <div class="seg" id="seg">
      <button class="on" data-v="both" onclick="setView('both')">双主题</button>
      <button data-v="light" onclick="setView('light')">仅浅色</button>
      <button data-v="dark" onclick="setView('dark')">仅深色</button>
    </div>
  </div>

  <div class="wrap" id="wrap">
    <div class="col" data-theme-col="light">
      <p class="h">浅色 LIGHT · 飞牛 Semi 蓝 #006AFF</p>
      <div class="light"><div class="card">
        <p class="card-title">系统概览</p>
        <div class="stat">
          <div><div class="stat-val">32%</div><div class="stat-label">CPU 占用</div></div>
          <div><div class="stat-val">54°C</div><div class="stat-label">CPU 温度</div></div>
        </div>
        <div class="btns">
          <button class="btn btn-primary">主要操作</button>
          <button class="btn btn-outline">次要</button>
          <button class="btn btn-danger">危险</button>
        </div>
        <table>
          <thead><tr><th>设备</th><th>状态</th><th>温度</th></tr></thead>
          <tbody>
            <tr><td>NVMe 系统盘</td><td><span class="tag tag-s">正常</span></td><td>42°C</td></tr>
            <tr><td>阵列卡</td><td><span class="tag tag-w">偏高</span></td><td>68°C</td></tr>
            <tr><td>风扇接管</td><td><span class="tag tag-i">自动</span></td><td>—</td></tr>
          </tbody>
        </table>
        <div class="rowtab"><button class="tab on">概览</button><button class="tab">温度墙</button><button class="tab">风扇</button></div>
        <div class="pal">
          <div class="sw" style="background:#006aff" title="#006AFF 主色"></div>
          <div class="sw" style="background:#00b42a" title="#00B42A 成功"></div>
          <div class="sw" style="background:#ff7d00" title="#FF7D00 警告"></div>
          <div class="sw" style="background:#f53f3f" title="#F53F3F 危险"></div>
          <div class="sw" style="background:#1d2129" title="#1D2129 文字"></div>
          <div class="sw" style="background:#e5e6eb" title="#E5E6EB 边框"></div>
          <div class="sw" style="background:#f2f3f5" title="#F2F3F5 填充"></div>
        </div>
      </div></div>
    </div>

    <div class="col" data-theme-col="dark">
      <p class="h">深色 DARK · Semi 深灰 #17171A</p>
      <div class="dark"><div class="card">
        <p class="card-title">系统概览</p>
        <div class="stat">
          <div><div class="stat-val">32%</div><div class="stat-label">CPU 占用</div></div>
          <div><div class="stat-val">54°C</div><div class="stat-label">CPU 温度</div></div>
        </div>
        <div class="btns">
          <button class="btn btn-primary">主要操作</button>
          <button class="btn btn-outline">次要</button>
          <button class="btn btn-danger">危险</button>
        </div>
        <table>
          <thead><tr><th>设备</th><th>状态</th><th>温度</th></tr></thead>
          <tbody>
            <tr><td>NVMe 系统盘</td><td><span class="tag tag-s">正常</span></td><td>42°C</td></tr>
            <tr><td>阵列卡</td><td><span class="tag tag-w">偏高</span></td><td>68°C</td></tr>
            <tr><td>风扇接管</td><td><span class="tag tag-i">自动</span></td><td>—</td></tr>
          </tbody>
        </table>
        <div class="rowtab"><button class="tab on">概览</button><button class="tab">温度墙</button><button class="tab">风扇</button></div>
        <div class="pal">
          <div class="sw" style="background:#3c7eff" title="#3C7EFF 主色"></div>
          <div class="sw" style="background:#2bc96a" title="#2BC96A 成功"></div>
          <div class="sw" style="background:#ff9a2e" title="#FF9A2E 警告"></div>
          <div class="sw" style="background:#f76965" title="#F76965 危险"></div>
          <div class="sw" style="background:#f7f8fa" title="#F7F8FA 文字"></div>
          <div class="sw" style="background:#2e2e30" title="#2E2E30 边框"></div>
          <div class="sw" style="background:#232324" title="#232324 填充"></div>
        </div>
      </div></div>
    </div>
  </div>

<script>
  function setView(v){
    document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
    document.querySelectorAll('#wrap .col').forEach(c=>{
      const t=c.dataset.themeCol;
      c.style.display = (v==='both'||v===t) ? '' : 'none';
    });
  }
</script>
</body>
</html>
