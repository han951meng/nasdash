    <div style="font-size:12px;color:var(--muted);margin-bottom:6px">不设置则使用上方「开转/全速」线性映射。设了曲线后，按曲线分段插值调速（点击预设一键生成，可再微调每个节点）。</div>
    <div class="curve-presets">
      <button class="preset-btn" onclick="applyCurvePreset('${prefix}','silent')">静音</button>
      <button class="preset-btn" onclick="applyCurvePreset('${prefix}','balanced')">均衡</button>
      <button class="preset-btn" onclick="applyCurvePreset('${prefix}','perf')">性能</button>
      <button class="preset-btn" onclick="applyCurvePreset('${prefix}','clear')">清除曲线</button>
    </div>
    <input type="hidden" id="${prefix}-curve-data" value="${initCurve?JSON.stringify(initCurve):'[]'}">
    <div id="${prefix}-curve-pts"></div>
    <button class="btn-mini" onclick="addCurvePoint('${prefix}')">+ 添加节点</button>
    <canvas id="${prefix}-curve-canvas" class="curve-canvas"></canvas>
  </div>`;
}
function applyCurvePreset(prefix, kind){
  var data=document.getElementById(prefix+'-curve-data'); if(!data) return;
  var pts = kind==='clear' ? [] : (CURVE_PRESETS[kind]||[]).map(function(p){return p.slice();});
  data.value=JSON.stringify(pts);
  renderCurvePoints(prefix);
  drawCurve(prefix);
  // 分段按钮的「未设」角标与顶部 pill 是在 renderFanControl 时按 f.has_curve 算的，
  // 编辑器内清空/预设切换不会触发重绘，需在此手动同步：
  //   点数≥2 → 移除「未设」角标（与 saveFanRule 成功后的处理一致）；
  //   点数<2 → 补回「未设」角标 + 提示 title，并把 pill 同步成「未设温控」，
  //            与曲线编辑器里「未设置曲线，使用线性映射」的提示语义对齐。
  var id=prefix.replace(/-r$/,'');
  var curveBtn=document.querySelector('#'+id+'-seg [data-mode="curve"]');
  var hasEnough = pts.length>=2;
  if(curveBtn){
    if(hasEnough){
      curveBtn.innerHTML='曲线温控';
      curveBtn.removeAttribute('title');
    } else {
      curveBtn.innerHTML='曲线温控<sup class="seg-sup">未设</sup>';
      curveBtn.setAttribute('title','点进来画一条自己的温度-转速曲线（至少 2 个节点）');
    }
  }
  if(!hasEnough){
    setFanPill(id, '未设温控', 'b-muted');
  }
}
function renderCurvePoints(prefix){
  var data=document.getElementById(prefix+'-curve-data');
  var box=document.getElementById(prefix+'-curve-pts');
  if(!data||!box) return;
  var pts=[]; try{ pts=JSON.parse(data.value||'[]'); }catch(e){}
  if(!pts.length){ box.innerHTML='<div class="dt-empty" style="padding:6px">未设置曲线，使用线性映射</div>'; return; }
  // 横向自适应表格：一行一个节点，列宽随容器自动伸展；列少时瘦、多时仍可读
  var rows = pts.map(function(p,i){
    return '<tr>'
      +'<td class="curve-pt-num">'+(i+1)+'</td>'
      +'<td><label class="curve-pt-input"><input type="number" class="cp-temp" data-i="'+i+'" value="'+p[0]+'" min="20" max="95" step="1"><span class="unit">°C</span></label></td>'
      +'<td><label class="curve-pt-input"><input type="number" class="cp-pwm" data-i="'+i+'" value="'+p[1]+'" min="0" max="100" step="1"><span class="unit">%</span></label></td>'
      +'<td style="text-align:right"><button class="curve-pt-del" type="button" title="删除该节点" onclick="removeCurvePoint(\''+prefix+'\','+i+')">✕</button></td>'
    +'</tr>';
  }).join('');
  box.innerHTML = '<table class="curve-pt-table">'
    +'<thead><tr><th>#</th><th>温度</th><th>占空比</th><th></th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>';
  box.querySelectorAll('input').forEach(function(inp){
    inp.addEventListener('change', function(){
      var i=parseInt(inp.dataset.i);
      var tEl=box.querySelector('.cp-temp[data-i="'+i+'"]');
      var pEl=box.querySelector('.cp-pwm[data-i="'+i+'"]');
      try{
        var arr=JSON.parse(data.value||'[]');
        arr[i]=[parseFloat(tEl.value)||0, parseFloat(pEl.value)||0];
        data.value=JSON.stringify(arr);
      }catch(e){}
      drawCurve(prefix);
    });
  });
}
function addCurvePoint(prefix){
  var data=document.getElementById(prefix+'-curve-data'); if(!data) return;
  var pts=[]; try{ pts=JSON.parse(data.value||'[]'); }catch(e){}
  var last = pts.length ? pts[pts.length-1][0]+10 : 50;
  if(last>92) last=92;
  pts.push([last, 60]);
  data.value=JSON.stringify(pts);
  renderCurvePoints(prefix);
  drawCurve(prefix);
}
function removeCurvePoint(prefix, i){
  var data=document.getElementById(prefix+'-curve-data'); if(!data) return;
  var pts=[]; try{ pts=JSON.parse(data.value||'[]'); }catch(e){}
  if(i>=0 && i<pts.length) pts.splice(i,1);
  data.value=JSON.stringify(pts);
  renderCurvePoints(prefix);
  drawCurve(prefix);
}
function readCurve(prefix){
  try{ return JSON.parse(document.getElementById(prefix+'-curve-data').value||'[]'); }catch(e){ return []; }
}
function drawCurve(prefix){
  var cv=document.getElementById(prefix+'-curve-canvas'); if(!cv) return;
  var data=document.getElementById(prefix+'-curve-data'); if(!data) return;
  var pts=[]; try{ pts=JSON.parse(data.value||'[]'); }catch(e){}
  var dpr=window.devicePixelRatio||1;
  var cssW=cv.clientWidth, cssH=cv.clientHeight;
  if(!cssW||!cssH) return;   // 面板隐藏时 clientWidth=0，跳过绘制，避免用兜底尺寸画出被 CSS 拉伸变形的图
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cssW,cssH);
  ctx.strokeStyle='rgba(128,128,128,.18)'; ctx.lineWidth=1;
  ctx.strokeRect(22,10,cssW-32,cssH-30);
  ctx.fillStyle='#8a93a6'; ctx.font='10px sans-serif';
  ctx.fillText('PWM%',4,16); ctx.fillText('温度℃',cssW-44,cssH-4);
  if(pts.length){
    var minT=20,maxT=95;
    var sorted=pts.slice().sort(function(a,b){return a[0]-b[0];});
    ctx.strokeStyle='#4aa3ff'; ctx.lineWidth=2; ctx.beginPath();
    sorted.forEach(function(p,i){
      var x=22+(cssW-32)*((Math.min(Math.max(p[0],minT),maxT)-minT)/(maxT-minT));
      var y=10+(cssH-30)*(1-p[1]/100);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    });
    ctx.stroke();
    ctx.fillStyle='#ff7a59';
    sorted.forEach(function(p){
      var x=22+(cssW-32)*((Math.min(Math.max(p[0],minT),maxT)-minT)/(maxT-minT));
      var y=10+(cssH-30)*(1-p[1]/100);
      ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    });
  }
}

function renderDetect(D){
  if(!D) return '';
  let r = D.raid||{}, disks = D.disks||[], s = D.system||{}, st = D.storage||{}, dk = D.docker||{};
  // 状态栏健康判定
  // 健康检查只看「可见 + 能读转速」的风扇：
  // - hidden（用户标记空口/不用的口）不参与判定；
  // - has_tach=false（2/3针无转速线、主板读不到）无法判断是否停转，也不参与，避免误报「异常」。
  //   日后换上带转速线的 4 针扇，has_tach 自动变 true，即自动恢复测速，无需任何额外设置。
  let fans = ((s.sensors&&s.sensors.fans)||[]).filter(f=>!f.hidden && f.has_tach);
  let fanOk = fans.length>0 && fans.every(f=>!(f.stopped||f.rpm<1));
  let fanStr = fans.length===0 ? 'N/A' : (fanOk?'正常':'异常');
  let raidOk = r.mode==='mega'||r.mode==='hba';
  let raidStr = r.mode==='mega' ? '正常' : r.mode==='hba' ? '正常' : (r.mode==='mega_error'?'读取失败':'未配置');
  let sasDisks = disks.filter(d=>(d.type||'').toUpperCase()==='SAS');
  let sataDisks = disks.filter(d=>{let t=(d.type||'').toUpperCase(); return t==='SATA'||t==='ATA';});
  let sasHealthy = sasDisks.filter(d=>d.health_ok).length;
  let sataHealthy = sataDisks.filter(d=>d.health_ok).length;
  let dockerStr = (dk.running||0)+' 运行中';
  let statusBar = `
  <div class="statusbar">
    <div class="status-left"><span class="status-dot"></span><span>系统运行正常 · 最近检测 ${D.time||''}</span></div>
    <div class="status-right">
      <div class="status-item"><span class="k">散热风扇</span><span class="v" style="color:${fanOk?'var(--green)':'var(--red)'}">${fanStr}</span></div>
      <div class="status-item"><span class="k">阵列卡</span><span class="v" style="color:${raidOk?'var(--green)':'var(--yellow)'}">${raidStr}</span></div>
      ${sasDisks.length?`<div class="status-item"><span class="k">SAS硬盘</span><span class="v" style="color:${sasHealthy===sasDisks.length?'var(--green)':'var(--orange)'}">${sasHealthy+'/'+sasDisks.length} 健康</span></div>`:''}
      ${sataDisks.length?`<div class="status-item"><span class="k">SATA硬盘</span><span class="v" style="color:${sataHealthy===sataDisks.length?'var(--green)':'var(--orange)'}">${sataHealthy+'/'+sataDisks.length} 健康</span></div>`:''}
      <div class="status-item"><span class="k">Docker</span><span class="v" style="color:var(--blue)">${dockerStr}</span></div>
    </div>
  </div>`;
  // 系统配置
  let cpuPct = s.cpu_threads ? Math.min(Math.round(parseFloat((s.load&&s.load[0])||0)/s.cpu_threads*100),100) : 0;
  let memMods = (s.memory_modules && s.memory_modules.modules) || [];
  let memModRows = memMods.length ? memMods.map(m=>{
    let stBadge = m.installed ? '<span class="badge b-ok">已用</span>' : '<span class="badge b-warn">空</span>';
    return `<tr style="${m.installed?'':'opacity:.45'}">

  let memSummary = mm ? (`插槽 ${mm.installed}/${mm.slots}` + (mm.brand_summary && mm.brand_summary!=='未知' ? ` · ${mm.brand_summary}` : '') + (mm.empty>0 ? ` · ${mm.empty} 空槽` : '')) : '';
  let memCard = `
  <div class="card" style="grid-column:1/-1">
    <h3>内存</h3>
    <div class="kv"><span class="k">总量</span><span class="v">${(s.memory&&s.memory.total)||'-'}</span></div>
    <div class="kv"><span class="k">已用</span><span class="v">${(s.memory&&s.memory.used)||'-'}</span></div>
    <div class="kv"><span class="k">占用率</span><span class="v" style="color:${s.memory&&s.memory.percent>70?'var(--orange)':'var(--green)'}">${(s.memory&&s.memory.percent)||0}%</span></div>
    <div class="kv"><span class="k">内存插槽</span><span class="v">${memSummary||'-'}</span></div>

  let bm = (s.board && s.board.manufacturer) || "";

  let boardEdit = `

  let boardCard = `

  let netCard = `

  let sysConfig = `

      ${(s.gpus&&s.gpus.length)?s.gpus.map(g=>`<div class="kv"><span class="k">显卡</span><span class="v">${g}</span></div>`).join(''):''}

  // 阵列卡 & 磁盘
  let raidCard;
  if(r.mode==='mega'){

    </div>`;
  };
  // 复用上方状态栏已声明的 sasDisks/sataDisks（同 filter 逻辑），避免 let 重复声明致 JS 解析崩溃
  sasDisks = disks.filter(d=>(d.type||'').toUpperCase()==='SAS');
  sataDisks = disks.filter(d=>{let t=(d.type||'').toUpperCase(); return t==='SATA'||t==='ATA';});
  let otherDisks = disks.filter(d=>{let t=(d.type||'').toUpperCase(); return t!=='SAS'&&t!=='SATA'&&t!=='ATA';});
  let diskMini = '';
  if(sasDisks.length) diskMini += `<div class="disk-group-title">SAS 硬盘 (${sasDisks.length})</div>` + sasDisks.map(diskItem).join('');
  if(sataDisks.length) diskMini += `<div class="disk-group-title">SATA 硬盘 (${sataDisks.length})</div>` + sataDisks.map(diskItem).join('');
  if(otherDisks.length) diskMini += `<div class="disk-group-title">其他硬盘 (${otherDisks.length})</div>` + otherDisks.map(diskItem).join('');
  if(!disks.length) diskMini = '<div class="loading">未检测到硬盘</div>';
  let raidDisk = `
  <div class="detect-cards">
    ${raidCard}
    <div class="card">
      <h3>磁盘健康 (SMART)</h3>
      ${diskMini}
    </div>
  </div>`;
  // 存储卷、Docker 容器列表均已移至左侧独立标签页，硬件配置检测仅保留概览状态栏
  return `
  <div class="detect-title">硬件配置检测</div>
  <div class="detect-sub">实时监测设备健康状态与硬件详情 · {{ APP_VERSION }}</div>
  ${statusBar}
  <div class="detect-title" style="font-size:16px;margin-bottom:10px">系统配置</div>
  ${sysConfig}
  <div class="detect-title" style="font-size:16px;margin:18px 0 10px">阵列卡 &amp; 磁盘</div>
  ${raidDisk}
  `;
}

function drawHist(d){
  const cv = document.getElementById('hist-canvas');
  if(!cv) return;
  const pts = (d && d.points) || [];
  const dpr = window.devicePixelRatio || 1;
  const cssW = cv.clientWidth || 600, cssH = 170;
  cv.width = Math.round(cssW*dpr); cv.height = Math.round(cssH*dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);
  const muted = getCSS('--muted') || '#8a93a6';
  if(!pts.length){
    ctx.fillStyle = muted; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('暂无数据（需运行一段时间后才会有历史记录）', cssW/2, cssH/2);
    return;
  }
  const maxV = Math.max(1, ...pts.map(p=>Math.max(p.disk_read||0, p.disk_write||0)));
  const padL=46, padR=10, padT=10, padB=20;
  const X = i => padL + (cssW-padL-padR)*(i/((pts.length-1)||1));
  const Y = v => (cssH-padB) - (cssH-padB-padT)*(v/maxV);
  ctx.strokeStyle='rgba(128,128,128,0.15)'; ctx.lineWidth=1;
  ctx.fillStyle=muted; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  for(let g=0; g<=3; g++){
    const yy = padT + (cssH-padT-padB)*(g/3);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(cssW-padR, yy); ctx.stroke();
    ctx.fillText(fmtSpeed(maxV*(1-g/3)), padL-4, yy);
  }
  const line=(key,color)=>{ ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.beginPath(); pts.forEach((p,i)=>{ const xx=X(i), yy=Y(p[key]||0); i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);}); ctx.stroke(); };
  line('disk_read','#4aa3ff');
  line('disk_write','#ff7a59');
  ctx.fillStyle=muted; ctx.textBaseline='alphabetic';
  ctx.textAlign='left'; ctx.fillText(fmtTime(pts[0].ts), padL, cssH-6);
  ctx.textAlign='right'; ctx.fillText(fmtTime(pts[pts.length-1].ts), cssW-padR, cssH-6);
}
async function loadHistory(){
  try{
    let r = await fetch('/api/history?range='+histRange+'&_='+Date.now());
    let d = await r.json();
    drawHist(d);
  }catch(e){}
}

async function loadData(){
  document.getElementById('spin').style.display='inline-block';
  try{
    let r = await fetch('/api/all?_='+Date.now());
    DATA = await r.json();
    renderAll();
    initHistory();
    loadHistory();
  }catch(e){
    document.getElementById('lastUpdate').textContent = '加载失败: '+e;
  }
  document.getElementById('spin').style.display='none';
}

// ---------- 检测新版本 ----------
let updateDismissed = false;
async function checkUpdate(force){
  const banner = document.getElementById('updateBanner');
  if(!force && updateDismissed) return;
  if(force){
    const btn = document.getElementById('checkUpdateBtn');
    if(btn){ btn.disabled = true; btn.textContent = '🔔 检查中…'; }
  }
  try{
    const r = await fetch('/api/version' + (force ? '?force=1' : ''));
    const d = await r.json();
    const link = document.getElementById('updateLink');
    if(d.update_available && d.latest){
      document.getElementById('updateText').innerHTML = '发现新版本 <b>'+d.latest+'</b>（当前 '+d.current+'）';
      link.href = d.url || 'https://github.com/han951meng/nasdash/releases';
      link.style.display = '';
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
      link.style.display = 'none';
      if(force){
        if(d.error){
          document.getElementById('updateText').textContent = '检查更新失败：' + d.error;
        } else {
          document.getElementById('updateText').textContent = '已是最新版本（'+d.current+'）';
        }
        banner.classList.add('show');
        if(!d.error){ setTimeout(()=>banner.classList.remove('show'), 3500); }
      }
    }
  }catch(e){
    if(force){
      document.getElementById('updateText').textContent = '检查更新出错：' + e;
      banner.classList.add('show');
    }
  }finally{
    if(force){
      const btn = document.getElementById('checkUpdateBtn');
      if(btn){ btn.disabled = false; btn.textContent = '🔔 检查更新'; }
    }
  }
}
function dismissUpdate(){ document.getElementById('updateBanner').classList.remove('show'); updateDismissed = true; }

checkUpdate(false);

// 滚动条自动隐藏：不用时彻底不渲染（隐藏），滚动时才浮现，停手约 0.9s 后消失（左侧栏与页面共用）
(function(){
  function autoHide(el){
    if(!el) return;
    var t;
    el.addEventListener('scroll', function(){
      el.classList.add('scrolling');
      clearTimeout(t);
      t = setTimeout(function(){ el.classList.remove('scrolling'); }, 900);
    }, {passive:true});
  }
  autoHide(document.querySelector('.sidebar'));
  var html = document.documentElement, t2;
  window.addEventListener('scroll', function(){
    html.classList.add('scrolling');
    clearTimeout(t2);
    t2 = setTimeout(function(){ html.classList.remove('scrolling'); }, 900);
  }, {passive:true});
})();
</script>
