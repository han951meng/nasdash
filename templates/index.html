<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function(){try{var t=localStorage.getItem('nasdash_theme');var dark;if(t==='dark'){dark=true;}else if(t==='light'){dark=false;}else{var fn=null;try{var f=localStorage.getItem('fnos-theme-mode');if(f==='dark'||f==='light')fn=f;}catch(e){}if(!fn){try{var p=new URLSearchParams(location.search).get('fnos-theme-mode');if(p==='dark'||p==='light')fn=p;}catch(e){}}if(!fn){try{if(window.parent&&window.parent!==window){var pp=new URLSearchParams(window.parent.location.search).get('fnos-theme-mode');if(pp==='dark'||pp==='light')fn=pp;}}catch(e){}}dark=(fn==='dark')?true:((fn==='light')?false:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){}})();
</script>
<title>飞牛 NAS 硬件监控</title>
<style>
  :root{
    color-scheme:light;
    /* ===== fnOS Semi Design 真实设计变量（飞牛真值，仿 Semi Design 色阶） ===== */
    --semi-grey-0:250,250,250; --semi-grey-1:243,243,243; --semi-grey-2:194,195,196; --semi-grey-3:159,160,161; --semi-grey-4:124,125,127; --semi-grey-5:90,91,92; --semi-grey-6:75,75,75; --semi-grey-7:48,48,48; --semi-grey-8:30,30,33; --semi-grey-9:11,11,12;
    --semi-brand-0:230,244,255; --semi-brand-1:215,237,255; --semi-brand-2:171,219,255; --semi-brand-3:117,191,255; --semi-brand-4:51,133,255; --semi-brand-5:0,102,255; --semi-brand-6:0,94,235; --semi-brand-7:0,67,184; --semi-brand-8:0,45,112; --semi-brand-9:0,31,77;
    --semi-green-4:35,177,120; --semi-green-5:0,158,97;
    --semi-amber-4:255,125,0; --semi-amber-5:255,154,46;
    --semi-red-4:226,96,82; --semi-red-5:219,56,44;
    /* 派生语义色（对齐飞牛真值） */
    --c-bg:#F7F8FA;
    --c-bg-1:#FFFFFF;
    --c-card:#FFFFFF;
    --c-text-0:rgba(var(--semi-grey-9),1);
    --c-text-1:rgba(var(--semi-grey-9),.75);
    --c-text-2:rgba(var(--semi-grey-9),.5);
    --c-text-3:rgba(var(--semi-grey-9),.25);
    --c-border:rgba(var(--semi-grey-9),.12);
    --c-fill-0:rgba(var(--semi-grey-9),.04);
    --c-fill-1:rgba(var(--semi-grey-9),.06);
    --c-fill-2:rgba(var(--semi-grey-9),.12);
    --c-primary:rgba(var(--semi-brand-5),1);
    --c-primary-hover:rgba(var(--semi-brand-6),1);
    --c-primary-active:rgba(var(--semi-brand-7),1);
    --c-primary-bg:rgba(var(--semi-brand-5),.10);
    --c-success:rgba(var(--semi-green-5),1);
    --c-warning:rgba(var(--semi-amber-5),1);
    --c-danger:rgba(var(--semi-red-5),1);
    --c-shadow:0 1px 2px rgba(var(--semi-grey-9),.05);
    /* 圆角（Semi: sm3 / md6 / lg12） */
    --r-sm:3px; --r-md:6px; --r-lg:12px; --r-xl:16px; --r-round:999px;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
    /* 兼容别名：现有 JS / CSS 继续用旧名，无缝飞牛化 */
    --blue:var(--c-primary); --green:var(--c-success); --orange:var(--c-warning); --red:var(--c-danger); --yellow:#CA8A04;
    --primary:var(--c-primary); --primary-hover:var(--c-primary-hover); --primary-active:var(--c-primary-active);
    --success:var(--c-success); --warning:var(--c-warning); --danger:var(--c-danger);
    --text-1:var(--c-text-0); --text-2:var(--c-text-1); --text-3:var(--c-text-2); --text-4:var(--c-text-3);
    --border:var(--c-border); --divider:var(--c-fill-1); --fill:var(--c-fill-1);
    --bg:var(--c-bg); --card:var(--c-card);
    --shadow:var(--c-shadow); --shadow-hover:0 4px 12px rgba(var(--semi-grey-9),.08);
    --text:var(--text-1); --muted:var(--text-3);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    /* 暗色：翻转色阶（同 Semi Design 机制） */
    --c-bg:#1A1E23;
    --c-bg-1:#23262B;
    --c-card:#23262B;
    --c-text-0:rgba(255,255,255,.92);
    --c-text-1:rgba(255,255,255,.65);
    --c-text-2:rgba(255,255,255,.45);
    --c-text-3:rgba(255,255,255,.28);
    --c-border:rgba(255,255,255,.12);
    --c-fill-0:rgba(255,255,255,.04);
    --c-fill-1:rgba(255,255,255,.06);
    --c-fill-2:rgba(255,255,255,.12);
    --c-primary:rgba(117,191,255,1);
    --c-primary-hover:rgba(145,205,255,1);
    --c-primary-active:rgba(86,170,255,1);
    --c-primary-bg:rgba(117,191,255,.14);
    --c-success:rgba(43,201,106,1);
    --c-warning:rgba(255,154,46,1);
    --c-danger:rgba(247,105,101,1);
    --c-shadow:0 1px 3px rgba(0,0,0,.3);
    --blue:var(--c-primary); --green:var(--c-success); --orange:var(--c-warning); --red:var(--c-danger); --yellow:#FFD60A;
    --primary:var(--c-primary); --primary-hover:var(--c-primary-hover); --primary-active:var(--c-primary-active);
    --success:var(--c-success); --warning:var(--c-warning); --danger:var(--c-danger);
    --text-1:var(--c-text-0); --text-2:var(--c-text-1); --text-3:var(--c-text-2); --text-4:var(--c-text-3);
    --border:var(--c-border); --divider:var(--c-fill-1); --fill:var(--c-fill-1);
    --bg:var(--c-bg); --card:var(--c-card);
    --shadow:var(--c-shadow); --shadow-hover:0 4px 12px rgba(0,0,0,.4);
    --text:var(--text-1); --muted:var(--text-3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .header{display:none} /* 桌面去掉置顶栏；汉堡按钮仅在移动端显示 */
  .hd-time{color:var(--text-3);font-size:12px;margin-right:2px}
  .hd-sep{width:1px;height:16px;background:var(--border);margin:0 2px}
  .ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn .ico{width:15px;height:15px;vertical-align:-2px}
  .icon-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:var(--r-md);cursor:pointer;font-size:14px;color:var(--text-2);transition:.15s;line-height:1}
  .icon-btn:hover{background:var(--c-fill-1);color:var(--text-1)}
  .icon-btn.themeToggle.is-auto{border-color:var(--c-primary);color:var(--c-primary)}
  .container{max-width:1600px;margin:0 auto;padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
  .sidebar{width:208px;flex:0 0 208px;background:var(--card);border:1px solid var(--border);box-shadow:var(--c-shadow);border-radius:var(--r-md);padding:10px 8px;position:sticky;top:18px;will-change:transform;max-height:calc(100vh - 36px);overflow-y:auto;overscroll-behavior:contain}
  /* 滚动条：占位常驻（不抖），thumb 永远真透明（完全看不见，无论滚不滚） */
  .sidebar,html{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .sidebar::-webkit-scrollbar,html::-webkit-scrollbar{width:8px;height:8px}
  .sidebar::-webkit-scrollbar-thumb,html::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
  .sidebar::-webkit-scrollbar-track,html::-webkit-scrollbar-track{background:transparent}
  .sidebar-title{font-size:12px;color:var(--text-3);letter-spacing:.3px;padding:2px 10px 8px}
  .sb-group{font-size:11px;color:var(--text-3);padding:12px 10px 4px;letter-spacing:.3px;margin-top:4px}
  .sb-group:first-of-type{margin-top:0}
  .tabs{display:flex;flex-direction:column;gap:2px}
  .tab{width:100%;padding:9px 12px;text-align:left;cursor:pointer;border-radius:var(--r-md);font-size:14px;font-weight:400;color:var(--text-1);transition:background .15s,color .15s;border:none;background:none;display:flex;align-items:center;gap:10px;position:relative}
  .tab svg.ic,.tab img.ic,.hero-ic svg.ic,.hero-ic img.ic{width:30px;height:30px;flex:none;display:block;object-fit:contain}
  .hero-ic img.ic{width:48px;height:48px}
  /* 图标透明背景：直接浮在页面背景上，暗色下不会有白色底板 */
  .tab img.ic,.hero-ic img.ic{background:transparent;border-radius:0;padding:0;box-shadow:none}
  .tab:hover{background:var(--c-fill-1)}
  .tab.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12);border-left:3px solid var(--primary);padding-left:9px}
  .content{flex:1;min-width:0}
  .panel{display:none}
  /* 移动端抽屉导航（桌面隐藏，仅手机显示汉堡按钮） */
  .menu-toggle{display:none}
  .nav-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:45}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(var(--semi-grey-9),.45);z-index:10000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
  .modal-overlay.show{display:flex}
  .modal-box{width:100%;max-width:420px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow-hover);padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px;animation:modalIn .18s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .modal-title{font-size:16px;font-weight:600;color:var(--text-1)}
  .modal-body{font-size:14px;color:var(--text-1);line-height:1.7;white-space:pre-line}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
  .modal-overlay .btn{min-width:72px}
  .modal-box.modal-wide{max-width:min(820px, calc(100vw - 32px));width:100%}
  .logstat{margin-bottom:10px;font-size:13px;color:var(--text-1)}
  .logstat b{font-size:13px;margin:0 2px}
  .logstat b.danger{color:#e0394a}
  .logstat b.warn{color:#c47b00}
  .log-list{border:1px solid var(--c-border);border-radius:8px;max-height:min(480px, 58vh);overflow:auto;background:var(--c-fill-2)}
  .log-line{font-family:Consolas,Menlo,monospace;font-size:12px;padding:5px 12px;border-bottom:1px solid var(--c-border);white-space:pre-wrap;word-break:break-all;line-height:1.55;color:var(--text-1)}
  .log-line:last-child{border-bottom:none}
  .log-line .lt{color:var(--muted);margin-right:8px;font-size:11px}
  .log-line.lv-err{background:rgba(224,57,74,.10);color:#e0394a}
  .log-line.lv-warn{background:rgba(196,123,0,.10);color:#c47b00}
  .log-empty{padding:18px 12px;color:var(--muted);text-align:center;font-size:13px}
  .panel.active{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border-radius:var(--r-md);padding:var(--s-4);box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .2s}
  .card h3{font-size:13px;color:var(--text-3);margin-bottom:10px;font-weight:600;letter-spacing:.3px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;border-bottom:1px solid var(--divider);gap:12px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex:0 0 auto;max-width:60%}
  .kv .v{font-weight:500;text-align:right;word-break:break-all;flex:1;min-width:0}
  .badge{display:inline-block;padding:2px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:600}
  .b-ok{background:rgba(0,180,42,.12);color:#0A8C20}
  .b-warn{background:rgba(255,125,0,.12);color:#C85A00}
  .b-bad{background:rgba(245,63,63,.12);color:#C7392F}
  .tag-sleep{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:var(--r-sm);font-size:11px;font-weight:600;background:rgba(0,180,42,.12);color:#0A8C20;vertical-align:middle}
  .disk-busy{display:block;font-size:11px;color:var(--text-3);margin-top:2px;font-weight:400}
  .b-info{background:var(--c-primary-bg);color:var(--primary)}
  .b-muted{background:var(--fill);color:var(--text-3)}
  .disk-card{position:relative}
  .disk-card.bad{border-color:var(--red);background:#fef2f2}
  .disk-card.warn{border-color:var(--orange)}
  .disk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .disk-head .name{font-size:16px;font-weight:600}
  .temp-bar{height:6px;border-radius:3px;background:var(--fill);margin:8px 0;overflow:hidden}
  .temp-fill{height:100%;border-radius:3px;transition:width .3s}
  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--divider)}
  .table th{color:var(--text-3);font-weight:500;background:var(--fill)}
  .table tr:hover{background:var(--fill)}
  .table td{color:var(--text-2)}
  .progress{height:20px;background:var(--fill);border-radius:10px;overflow:hidden;position:relative}
  .progress-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:600}
  .btn{border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 16px;font-size:14px;cursor:pointer;transition:.2s;font-weight:500;background:transparent;color:var(--text-2)}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
  .btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn-danger:hover{opacity:.9}
  .btn-ghost{background:transparent;color:var(--primary);border-color:transparent}
  .btn-ghost:hover{background:var(--c-primary-bg)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  .switch input{display:none}
  .slider{width:34px;height:18px;background:var(--border);border-radius:10px;position:relative;transition:.2s}
  .slider:before{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .switch input:checked+.slider{background:var(--success)}
  .switch input:checked+.slider:before{transform:translateX(16px)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .skeleton{background:linear-gradient(90deg,rgba(128,128,128,.12) 25%,rgba(128,128,128,.22) 37%,rgba(128,128,128,.12) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--card)}
  .sk-line{height:13px;margin:12px 0;border-radius:6px}
  pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;max-height:400px;white-space:pre-wrap}
  .section-title{font-size:15px;font-weight:600;margin:18px 0 10px;color:var(--text)}
  .pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;margin-left:6px}
  .pill.gray{background:var(--fill);color:var(--text-3)}
  .pill.red{background:rgba(245,63,63,.12);color:var(--danger)}
  .pill.green{background:rgba(0,180,42,.12);color:var(--success)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .split-col{display:flex;flex-direction:column;gap:14px}
  .disk-scroll{overflow:auto;padding-right:4px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .sys-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,12fr);gap:14px;align-items:start}
  .sys-grid .card{min-width:0;box-sizing:border-box;display:flex;flex-direction:column}
  .sys-grid > .sys-area-cpu{grid-column:1;grid-row:1}
  .sys-grid > .sys-area-mem{grid-column:1;grid-row:2}
  .sys-grid > .sys-area-netlive{grid-column:1;grid-row:3}
  .sys-grid > .sys-area-disk{grid-column:2;grid-row:1 / span 3}
  .detect-title{font-size:16px;font-weight:500;margin-bottom:2px;color:var(--text-1)}
  .detect-sub{font-size:13px;color:var(--text-3);margin-bottom:14px}
  /* ===== hero 横幅（对齐飞牛虚拟机概览页）===== */
  .hero{background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.05);border-radius:var(--r-md);padding:20px 24px;margin-bottom:16px;color:#1f2329;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(117,191,255,.05)}
  .hero-head{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1;flex-wrap:nowrap;min-height:54px}
  .hero-left{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;overflow:hidden}
  .hero-text{min-width:0}
  .hero-right{display:inline-flex;align-items:center;gap:8px;flex:none;flex-wrap:nowrap}
  .hero-ic{width:52px;height:52px;flex:none;border-radius:var(--r-md);background:transparent;border:1px solid transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
  .hero-title{font-size:18px;font-weight:500;color:#1f2329;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-sub{font-size:12px;color:#646a73;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(117,191,255,.14);border-radius:var(--r-round);padding:5px 12px;font-size:12px;color:#2a6fd6;white-space:nowrap;flex-shrink:0}
  .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80}
  .hero-badge.warn .dot{background:#FDE047}
  .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:18px;position:relative;z-index:1}
  .hs{background:rgba(117,191,255,.06);border:1px solid rgba(0,0,0,.05);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:78px;text-align:center}
  .hs-v{font-size:28px;font-weight:600;color:#1f2329;line-height:1.15;white-space:nowrap;text-align:center}
  .hs-v small{font-size:13px;font-weight:500;opacity:.7;margin-left:3px}
  .hs-k{font-size:13px;color:#646a73;margin-top:5px;font-weight:500;text-align:center}
  .hs-uptime .hs-v{white-space:normal;word-break:break-all;font-size:20px;line-height:1.25}
  .hs.bad .hs-v{color:#E5484D;background:rgba(229,72,77,.12);padding:1px 8px;border-radius:6px;display:inline-block}
  .hs.warn .hs-v{color:#B45309;background:rgba(180,83,9,.12);padding:1px 8px;border-radius:6px;display:inline-block}
  /* 暗色主题：hero 用和页面卡片一致的深色卡，只留一条飞牛蓝左边条做标识，不再用高饱和蓝渐变 */
  [data-theme="dark"] .hero{background:var(--c-card);border:1px solid var(--c-border);box-shadow:var(--c-shadow);border-left:3px solid var(--c-primary);color:var(--c-text-0)}
  [data-theme="dark"] .hero::after{display:none}
  [data-theme="dark"] .hero-title{color:var(--c-text-0)}
  [data-theme="dark"] .hero-sub{color:var(--c-text-1)}
  [data-theme="dark"] .hero-badge{background:var(--c-fill-2);color:var(--c-text-0)}
  [data-theme="dark"] .hero-action .btn-mini{background:var(--c-fill-2);border-color:transparent;color:var(--c-text-0)}

  .seg-btn.disabled:hover{color:var(--muted)}
  .seg-sup{font-size:9px;opacity:.6;margin-left:2px;vertical-align:super}
  .fan-mode-body{margin-top:6px}
  .fan-rule-source{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:13px}
  .fan-rule-source label{color:var(--muted);min-width:48px}
  .fan-rule-source select{flex:1;max-width:220px}
  .fan-rule-source .fan-rule-live{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .fan-rule-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .fan-rule-curve-wrap{margin-top:4px}
  .fan-rule-curve{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
  .fan-rule-curve-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .sleep-panel{margin-bottom:14px}
  .sleep-panel-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 2px;font-size:14px;font-weight:600}
  .sleep-panel-toggle{font-size:14px;color:var(--muted)}
  .sleep-panel-body{padding-top:10px}
  /* 当前温度概览（紧凑单行横向 chip 流） */
  .temp-overview{margin-bottom:14px;padding:12px 14px}
  .temp-overview-head{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .temp-updated{font-size:11px;font-weight:400;color:var(--muted);margin-left:auto}
  .temp-row{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
  .temp-cat{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;width:100%;margin-top:4px;padding-top:6px;border-top:1px dashed var(--border)}
  .temp-cat:first-of-type{margin-top:8px;padding-top:0;border-top:none}
  .temp-cat-label{font-size:11px;color:var(--muted);min-width:42px;font-weight:600;align-self:center}
  .temp-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;line-height:1.4;white-space:nowrap;min-height:34px}
  .temp-chip.off{opacity:.65}
  .temp-chip-name{color:var(--muted);font-variant-numeric:tabular-nums}
  .temp-chip-val{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .temp-chip-tag{font-size:10px;padding:1px 5px;border-radius:6px;line-height:1.3}
  .temp-chip-tag.off{color:var(--blue);background:rgba(120,170,255,.12)}
  .temp-chip-tag.on{color:var(--muted);background:#fff;border:1px solid var(--border)}
  .temp-chip-empty{font-size:12px;color:var(--muted);padding:4px 0}
  /* 风扇曲线编辑器：横向自适应（节点放成表格，单元更紧凑） */
  .curve-pt-table{width:100%;border-collapse:collapse;font-size:12px}
  .curve-pt-table th{font-weight:500;color:var(--muted);padding:3px 4px;text-align:left;border-bottom:1px solid var(--border)}
  .curve-pt-table td{padding:4px 4px;border-bottom:1px dashed var(--divider);vertical-align:middle}
  .curve-pt-table tr:last-child td{border-bottom:none}
  .curve-pt-num{color:var(--muted);text-align:center;width:24px;font-variant-numeric:tabular-nums}
  .curve-pt-input{display:inline-flex;align-items:stretch;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden}
  .curve-pt-input input{width:52px;padding:4px 6px;font-size:12px;border:none;background:transparent;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .curve-pt-input input:focus{outline:none;background:#eff6ff}
  .curve-pt-input .unit{padding:4px 6px;font-size:11px;color:var(--muted);background:var(--bg);border-left:1px solid var(--border);min-width:22px;text-align:center}
  .curve-pt-del{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:12px}
  .curve-pt-del:hover{color:var(--red);border-color:rgba(245,63,63,.4)}
  .curve-canvas{width:100%;height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:8px;display:block}
  /* 硬盘温度控制风扇面板 */
  .dt-panel{--dt-gap:16px;padding:18px}
  .dt-panel h3{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:16px}
  .dt-section{margin-bottom:18px}
  .dt-section-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dt-section-title .count{font-size:11px;color:var(--blue);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
  .dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .dt-hint{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:6px;padding:8px 12px;margin-bottom:12px}
  .dt-hint b{color:var(--text);font-weight:600}
  .dt-opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
  .dt-opt:hover{border-color:var(--blue)}
  .dt-opt input[type=checkbox]{margin:0;margin-top:2px;accent-color:var(--blue);flex-shrink:0}
  .dt-opt .dt-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .dt-opt .dt-name{font-size:13px;font-weight:500;color:var(--text);word-break:break-all;line-height:1.35}
  .dt-opt .dt-meta{font-size:11px;color:var(--muted);white-space:normal;word-break:break-word;line-height:1.4}
  .dt-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg);border:1px dashed var(--border);border-radius:8px}
  .dt-thresholds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .dt-field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  .dt-field label{font-size:13px;color:var(--muted);margin:0;min-width:64px}
  .dt-field input[type=number]{width:64px;padding:5px 7px;font-size:14px;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
  .dt-field input[type=number]:focus{outline:none;border-color:var(--blue)}
  .dt-field .unit{font-size:12px;color:var(--muted)}
  .dt-options{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .dt-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
  .dt-save-state{font-size:13px;color:var(--muted)}
  .dt-save-state.ok{color:var(--green)}
  .dt-warn{display:none;margin:8px 0;padding:10px 12px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px;line-height:1.55}
  .dt-live{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px}
  .dt-live b{font-size:16px;color:var(--green)}
  .dt-toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
  .dt-toggle input{accent-color:var(--blue);flex-shrink:0}
  .dt-toggle .num-stepper{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
  .dt-toggle .num-stepper input{width:44px;padding:4px 2px;font-size:14px;line-height:1.4;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);-moz-appearance:textfield;appearance:textfield}
  .dt-toggle .num-stepper input::-webkit-inner-spin-button,.dt-toggle .num-stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .dt-toggle .num-stepper .ns-btn{width:24px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;line-height:1;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;user-select:none;padding:0}
  .dt-toggle .num-stepper .ns-btn:hover{border-color:var(--blue);color:var(--blue)}
  .dt-toggle .num-stepper .ns-btn:active{transform:scale(.94)}
  /* 检测新版本横幅 */
  .update-banner{display:none;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff;padding:11px 18px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(234,88,12,.28);font-size:14px}
  .update-banner.show{display:flex}
  .update-banner a{color:#fff;text-decoration:underline;font-weight:700;white-space:nowrap}
  .update-banner .ub-close{background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;border-radius:6px;padding:3px 11px;font-size:13px}
  .update-banner .ub-close:hover{background:rgba(255,255,255,.35)}
  /* 历史趋势时间范围切换 */
  .seg{display:inline-flex;gap:6px;margin:2px 0 4px}
  .seg-btn{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.15s}
  .seg-btn:hover{color:var(--text)}
  .seg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* 告警横幅 */
  .alert-banner{display:none;align-items:flex-start;gap:12px;background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;padding:11px 18px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(185,28,28,.28);font-size:14px;line-height:1.6}
  .alert-banner.show{display:flex}
  .alert-banner .ab-close{background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;border-radius:6px;padding:3px 11px;font-size:13px;margin-left:auto}
  .alert-banner .ab-list{margin:0;padding-left:18px}
  /* 控制与自动化（浅色主题，与全站 .card / .dt-field 一致） */
  .auto-head,.manual-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .auto-head h2,.manual-head h2{margin:0;font-size:18px;color:var(--text)}
  .auto-head .auto-sub,.manual-head .auto-sub{font-size:12px;color:var(--muted);margin-top:3px}
  /* 操作手册：右侧可自动隐藏的目录（抽屉式，不挤占正文） */
  .man-layout{display:block}
  .man-content{width:100%}
  /* 目录面板：固定在右侧中部，可滑入/滑出 */
  .man-toc{position:fixed;top:50%;right:38px;transform:translateY(-50%);z-index:40;
    width:212px;max-height:74vh;overflow:auto;
    background:var(--card);border:1px solid var(--border);border-right:none;
    border-radius:14px 0 0 14px;padding:14px 12px;box-shadow:-3px 3px 14px rgba(0,0,0,.10);
    transition:transform .25s ease,opacity .25s ease}
  .man-toc.collapsed{transform:translateY(-50%) translateX(120%);opacity:0;pointer-events:none}
  .man-toc-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;padding:0 6px}
  .man-toc ul{list-style:none;margin:0;padding:0}
  .man-toc li{margin:1px 0;line-height:1.45}
  .man-toc li.lv3{padding-left:12px}
  .man-toc a{display:block;color:var(--text);text-decoration:none;font-size:13px;padding:4px 6px;border-radius:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .man-toc a:hover{background:var(--fill);color:var(--primary)}
  /* 右侧常驻的「目录」开关按钮（竖向标签） */
  .man-toc-btn{position:fixed;top:50%;right:0;transform:translateY(-50%);z-index:41;
    background:var(--primary);color:#fff;border:none;border-radius:12px 0 0 12px;
    padding:15px 9px;cursor:pointer;font-size:13px;letter-spacing:.14em;
    writing-mode:vertical-rl;box-shadow:-2px 2px 8px rgba(0,0,0,.16)}
  .man-toc-btn:hover{filter:brightness(1.06)}
  @media(max-width:820px){
    .man-toc{width:172px;max-height:66vh}
    .man-toc-btn{padding:12px 7px;font-size:12px}
  }
  /* 当前版本段：版本号匹配 APP_VERSION 时由前端整体标红（不止标题） */
  /* 用 .man-body .man-red-block ... 双重类选择器，确保优先级高于手册内嵌的 .man-body p/h2/blockquote 等颜色规则 */
  .man-body .man-red-block,
  .man-body .man-red-block h1,.man-body .man-red-block h2,.man-body .man-red-block h3,.man-body .man-red-block h4,
  .man-body .man-red-block p,.man-body .man-red-block li,.man-body .man-red-block ul,.man-body .man-red-block ol,
  .man-body .man-red-block blockquote,.man-body .man-red-block strong,.man-body .man-red-block b,
  .man-body .man-red-block a,.man-body .man-red-block td,.man-body .man-red-block th{
    color:var(--danger)
  }
  .auto-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .auto-card h3{margin:0 0 14px;font-size:15px;color:var(--text);display:flex;align-items:center;gap:8px}
  .auto-alerts{list-style:none;padding:0;margin:0}
  .auto-alerts li{padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5;color:var(--text)}
  .auto-alerts li.danger{background:rgba(239,68,68,.12);color:#b91c1c;border-left:3px solid #ef4444}
  .auto-alerts li.warn{background:rgba(245,158,11,.15);color:#b45309;border-left:3px solid #f59e0b}
  .auto-alerts li.ok{background:rgba(34,197,94,.1);color:#15803d;border-left:3px solid #22c55e}
  .auto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .auto-field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .auto-field input[type=number],.auto-field input[type=text]{width:100%;padding:7px 9px;background:#fff;border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px}
  .auto-field .unit{font-size:11px;color:var(--muted)}
  .dt-toggle{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;cursor:pointer;color:var(--text)}
  .dt-toggle input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
  .dt-toggle .num-stepper{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
  .dt-toggle .num-stepper input{width:44px;padding:4px 2px;font-size:14px;line-height:1.4;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);-moz-appearance:textfield;appearance:textfield}
  .dt-toggle .num-stepper input::-webkit-inner-spin-button,.dt-toggle .num-stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .dt-toggle .num-stepper .ns-btn{width:24px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;line-height:1;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;user-select:none;padding:0}
  .dt-toggle .num-stepper .ns-btn:hover{border-color:var(--blue);color:var(--blue)}
  .dt-toggle .num-stepper .ns-btn:active{transform:scale(.94)}
  .chan{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
  .chan h4{margin:0 0 10px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px}
  .chan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
  .auto-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .dt-save-state{font-size:12px;color:var(--muted)}
  .dt-save-state.ok{color:var(--green,#22c55e)}
  .dt-warn{display:none;margin:6px 0;padding:9px 11px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:12px;line-height:1.5}
  /* 风扇曲线编辑器 */
  .curve-presets{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
  .curve-canvas{width:100%;height:150px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:8px;display:block}
  /* 2.0 暗色兜底：子面板背景跟随 fill，避免黑底黑块；文字色统一走 Token */
  [data-theme="dark"] .mem-slot,[data-theme="dark"] .temp-chip,[data-theme="dark"] .fan-card,[data-theme="dark"] .fan-presets,[data-theme="dark"] .dt-field,[data-theme="dark"] .dt-opt,[data-theme="dark"] .chan,[data-theme="dark"] .dt-live,[data-theme="dark"] .fan-rule-tip,[data-theme="dark"] .fan-hw-note,[data-theme="dark"] .fan-dc-note,[data-theme="dark"] .dt-hint,[data-theme="dark"] .temp-overview,[data-theme="dark"] .sleep-panel,[data-theme="dark"] .auto-card,[data-theme="dark"] .curve-pt-input,[data-theme="dark"] .fan-label-input,[data-theme="dark"] .fan-volt-select,[data-theme="dark"] .fan-rule-src,[data-theme="dark"] .fan-rule-fields input,[data-theme="dark"] .dt-field input,[data-theme="dark"] .auto-field input,[data-theme="dark"] .curve-canvas{background:var(--fill);border-color:var(--border)}
  /* 表单控件文字色显式补 Token：select/input 的 color 在部分浏览器/内核（Safari/webview）不继承页面样式，
     深底 + 系统默认黑字 = 深色模式下文字空白（温度源下拉框 2.0 以来的论坛反馈 bug）；color-scheme 已同步声明 */
  [data-theme="dark"] .fan-rule-src,[data-theme="dark"] .fan-volt-select,[data-theme="dark"] .fan-rule-fields input,[data-theme="dark"] .dt-field input,[data-theme="dark"] .auto-field input,[data-theme="dark"] .curve-pt-input,[data-theme="dark"] .fan-label-input{color:var(--text)}
  [data-theme="dark"] .fan-rule-src option,[data-theme="dark"] .fan-volt-select option{background:var(--card);color:var(--text)}
  [data-theme="dark"] .kv{border-color:var(--divider)}
  [data-theme="dark"] .disk-group-title{color:var(--text-3)}
  [data-theme="dark"] .disk-card.bad{background:rgba(247,105,101,.08)}
  [data-theme="dark"] .disk-card.warn{background:rgba(255,154,46,.08)}
  [data-theme="dark"] .b-sas,[data-theme="dark"] .b-sata,[data-theme="dark"] .b-nvme{background:var(--fill);color:var(--text-2);border:1px solid var(--border)}
  [data-theme="dark"] .fan-hw-toggle{border-color:var(--border)}
  [data-theme="dark"] .update-banner,[data-theme="dark"] .alert-banner{filter:brightness(.92)}
  [data-theme="dark"] .temp-bar,[data-theme="dark"] .progress{background:var(--border)}
  [data-theme="dark"] .temp-chip-tag.on{background:var(--fill);color:var(--text-2)}
  [data-theme="dark"] .btn-mini.danger{background:rgba(247,105,101,.12);color:#ff9a8a;border-color:rgba(247,105,101,.4)}
  [data-theme="dark"] .dt-warn{background:rgba(255,154,46,.12);color:#ffb56b;border-color:rgba(255,154,46,.4)}
  [data-theme="dark"] .b-ok{color:var(--success)} [data-theme="dark"] .b-warn{color:var(--warning)} [data-theme="dark"] .b-bad{color:var(--danger)}
  [data-theme="dark"] .curve-pt-input input:focus{background:var(--fill)}
  [data-theme="dark"] .auto-alerts li.danger{color:#ff8a85} [data-theme="dark"] .auto-alerts li.warn{color:#ffb56b} [data-theme="dark"] .auto-alerts li.ok{color:#5fd98a}
</style>
</head>
<body>
<div class="header">
  <button class="btn menu-toggle" id="menuToggle" onclick="toggleSidebar()"><svg class="ico" viewBox="0 0 24 24"><use href="#i-menu"/></svg> 模块</button>
</div>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">监控模块</div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('detect',this)"><img src="{{ ICON_DETECT_DATA }}" class="ic" alt="硬件配置检测"> 硬件配置检测</button>
      <div class="sb-group">资源监控</div>
      <button class="tab" onclick="switchTab('system',this)"><img src="{{ ICON_SYSTEM_DATA }}" class="ic" alt="系统资源"> 系统资源</button>
      <button class="tab" onclick="switchTab('temps',this)"><svg class="ico ic" viewBox="0 0 24 24"><use href="#i-thermo"/></svg> 温度监控</button>
      <button class="tab" onclick="switchTab('sys-hist',this)"><img src="{{ ICON_HISTORY_DATA }}" class="ic" alt="历史趋势"> 历史趋势</button>
      <div class="sb-group">存储</div>
      <button class="tab" onclick="switchTab('disks',this)"><img src="{{ ICON_HDD_DATA }}" class="ic" alt="硬盘"> 硬盘 SMART</button>
      <button class="tab" onclick="switchTab('storage',this)"><img src="{{ ICON_STORAGE_DATA }}" class="ic" alt="存储卷"> 存储卷</button>

// 2.0 明暗主题切换：明 / 暗 / 自动（跟随系统），单按钮循环切换
function getThemeMode(){
  try{var t=localStorage.getItem('nasdash_theme');if(t==='light'||t==='dark'||t==='auto')return t;}catch(e){}
  return 'auto'; // 默认跟随系统，向后兼容旧版“无设置即跟随系统”
}
// 读取飞牛系统当前明暗：飞牛把主题写在 localStorage 的 fnos-theme-mode（dark/light），
// 也会通过 iframe URL 参数 ?fnos-theme-mode=...（自己或父框架）传递；拿不到返回 null
function fnosThemeMode(){
  try{ var f=localStorage.getItem('fnos-theme-mode'); if(f==='dark'||f==='light') return f; }catch(e){}
  try{ var p=new URLSearchParams(location.search).get('fnos-theme-mode'); if(p==='dark'||p==='light') return p; }catch(e){}
  try{ if(window.parent&&window.parent!==window){ var pp=new URLSearchParams(window.parent.location.search).get('fnos-theme-mode'); if(pp==='dark'||pp==='light') return pp; } }catch(e){}
  return null;
}
// 计算“目标”明暗：auto 时优先跟随飞牛系统明暗（fnos-theme-mode），拿不到再退回浏览器系统偏好
function resolvedDark(){
  var m=getThemeMode();
  if(m==='dark') return true;
  if(m==='light') return false;
  var fn=fnosThemeMode();
  if(fn==='dark') return true;
  if(fn==='light') return false;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}
// 页面此刻真实生效的明暗（只读 data-theme），保证“当前颜色”与页面完全一致，不会自相矛盾
function currentIsDark(){
  return document.documentElement.getAttribute('data-theme')==='dark';
}
function applyTheme(){
  var dark=resolvedDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  updateThemeBtn();
}
function setThemeMode(m){
  try{localStorage.setItem('nasdash_theme',m);}catch(e){}
  applyTheme();
}
function cycleTheme(){
  var order=['light','dark','auto'];
  var i=order.indexOf(getThemeMode());

(function(){

function iconSvg(name, cls){
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}
// 自动模式用专属图标（contrast 半明半暗，代表“跟随系统随时切换”），与手动浅/深区分开；当前真实深/浅只写在 title 里
function themeIcon(){
  var m=getThemeMode();
  if(m==='auto') return iconSvg('contrast');
  return m==='dark'?iconSvg('moon'):iconSvg('sun');
}
function themeTitle(){
  var m=getThemeMode();
  if(m==='auto') return '主题：跟随系统（当前'+(currentIsDark()?'深色':'浅色')+'）· 点击切换';
  return '主题：'+(m==='dark'?'深色':'浅色')+' · 点击切换';
}
function updateThemeBtn(){
  var icon=themeIcon(), title=themeTitle();
  document.querySelectorAll('.themeToggle').forEach(function(b){ b.innerHTML=icon; b.title=title; b.classList.toggle('is-auto',getThemeMode()==='auto'); });
}
// 自动模式实时跟随：① 浏览器系统偏好变化；② 飞牛系统明暗变化（飞牛切换时更新 localStorage 的 fnos-theme-mode 并触发 storage 事件）
(function(){
  try{
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    var mqHandler=function(){ if(getThemeMode()==='auto') applyTheme(); };
    if(mq.addEventListener) mq.addEventListener('change',mqHandler); else if(mq.addListener) mq.addListener(mqHandler);
  }catch(e){}
  try{
    window.addEventListener('storage',function(e){ if(e.key==='fnos-theme-mode' && getThemeMode()==='auto') applyTheme(); });
  }catch(e){}
})();
// 初始化时先按当前模式对齐一次 data-theme，再刷新按钮（修正任何初始偏差）

// 统一网关适配：页面位于 /app/{appname} 路径下时，自动为所有绝对根路径 fetch 补上前缀；
// 本地 TCP 模式（根路径）下前缀为空，行为完全不变。无需逐个改 fetch 调用。
(function(){
  var _orig = window.fetch ? window.fetch.bind(window) : null;
  if (!_orig) return;
  var base = (location.pathname || '/').replace(/\/[^\/]*$/, '');
  window.fetch = function(u, o){
    if (typeof u === 'string' && u.charAt(0) === '/' && u.charAt(1) !== '/') {
      u = base + u;
    }
    return _orig(u, o);
  };
})();

// 当前处于激活状态的板块 id（无独立状态变量，直接从 DOM 读取，最鲁棒）
function currentTab(){ var p=document.querySelector('.panel.active'); return p?p.id:'detect'; }
// 按板块拉取 → 合并进全局 DATA → 只重渲该板块，避免每次都全量 /api/all
var PANEL_ENDPOINT={system:'/api/system', temps:'/api/system', fan:'/api/system', raid:'/api/raid', disks:'/api/disks', storage:'/api/storage', docker:'/api/docker'};
// ===================== 增量更新（避免整块 innerHTML 重建导致闪烁/滚动归位/交互态丢失）=====================
// 原理：若新旧 DOM 结构一致，只 patch 变化的文本节点与属性；结构变了（如盘位增减、容器增减）才整块重建。
function _sigChildren(node){
  const r=[];
  for(const c of node.childNodes){
    if(c.nodeType===1) r.push(c);                                   // 元素节点
    else if(c.nodeType===3 && c.nodeValue.trim()!=='') r.push(c);   // 非空文本节点
    // 注释 / 纯空白文本节点：不参与结构配对
  }
  return r;
}
function _morphAttrs(oldEl, newEl){
  const newMap={};
  for(const a of newEl.attributes) newMap[a.name]=a.value;
  for(const a of Array.from(oldEl.attributes)){           // 删除旧有、新无的属性
    if(!(a.name in newMap)) oldEl.removeAttribute(a.name);
  }
  for(const a of newEl.attributes){                        // 新增 / 更新
    if(oldEl.getAttribute(a.name)!==a.value) oldEl.setAttribute(a.name, a.value);
  }
}
// 返回 true = 结构不一致，调用方需整块重建
function _morph(oldNode, newNode){
  if(oldNode.nodeType!==newNode.nodeType) return true;
  if(oldNode.nodeType===3){ // 文本：仅值变化时改写
    if(oldNode.nodeValue!==newNode.nodeValue) oldNode.nodeValue=newNode.nodeValue;
    return false;
  }
  if(oldNode.nodeType!==1) return true; // 其它节点类型视为结构不一致
  if(oldNode.tagName!==newNode.tagName) return true;
  _morphAttrs(oldNode, newNode);
  const oc=_sigChildren(oldNode), nc=_sigChildren(newNode);
  let i=0;
  while(i<nc.length){
    if(i>=oc.length) return true;          // 新结构多出节点
    if(_morph(oc[i], nc[i])) return true;
    i++;
  }
  return oc.length!==nc.length;            // 旧结构多出节点
}
function smartUpdate(el, html){
  if(!el) return;
  const tpl=document.createElement('div');
  tpl.innerHTML=html;
  const oc=_sigChildren(el), nc=_sigChildren(tpl);
  if(!oc.length || oc.length!==nc.length){ el.innerHTML=html; return; } // 首次或结构变化 → 全量
  for(let i=0;i<oc.length;i++){
    if(_morph(oc[i], nc[i])){ el.innerHTML=html; return; }              // 结构不一致 → 全量
  }
  // 结构一致：仅变化的文本/属性已被 patch，无需重建
}

async function refreshPanel(id){
  if(!DATA){ return; }  // 首屏尚未 loadData 完成时不介入
  document.querySelectorAll('.spin').forEach(spin=>spin.style.display='inline-block');
  try{
    if(id==='detect'){ // 硬件配置检测是全局概览，需要所有数据 → 走全量
      var rr=await fetch('/api/all?_='+Date.now()); DATA=await rr.json(); renderAll(); return;
    }
    if(id==='sys-hist'){ loadHistory(); return; }
    if(id==='automation'){ if(typeof refreshAutomationAlerts==='function') refreshAutomationAlerts(); return; }
    var url=PANEL_ENDPOINT[id];
    if(!url) return;
    var r=await fetch(url+'?_='+Date.now());
    var d=await r.json();
    if(!d || d.error) return;
    if(d.system!==undefined) DATA.system=d.system;
    if(d.raid!==undefined) DATA.raid=d.raid;
    if(d.disks!==undefined) DATA.disks=d.disks;
    if(d.storage!==undefined) DATA.storage=d.storage;
    if(d.docker!==undefined) DATA.docker=d.docker;
    if(d.time) DATA.time=d.time;
    if(d.elapsed!==undefined) DATA.elapsed=d.elapsed;
    renderPanel(id);
  }catch(e){}
  finally{ document.querySelectorAll('.spin').forEach(spin=>spin.style.display='none'); }
}
// 只重渲指定板块（不碰其他面板 DOM）
function renderPanel(id){
  if(!DATA || DATA.error) return;
  if(id==='raid'){ smartUpdate(document.getElementById('raid'), renderRaid(DATA.raid, DATA.disks)); }
  else if(id==='disks'){ smartUpdate(document.getElementById('disks'), renderDisks(DATA.disks)); }
  else if(id==='system'){ smartUpdate(document.getElementById('system'), renderSystem(DATA.system)); }
  else if(id==='temps'){ smartUpdate(document.getElementById('temps'), renderTemps(DATA.system)); }
  else if(id==='storage'){ smartUpdate(document.getElementById('storage'), renderStorage(DATA.storage)); }
  else if(id==='docker'){ smartUpdate(document.getElementById('docker'), renderDocker(DATA.docker)); }
  else if(id==='fan'){
    // 方案 A：风扇页不再参与 30s 自动刷新的整页重建——它的实时数据（转速/温度/徽标/接管状态）
    // 已由 fetchFanStatus(1s)、fetchTemps(5s)、refreshFanControlState() 就地更新，30s 整页重载
    // 只会造成页面每 30s 闪一下、打断正在编辑的滑块/曲线（曾用户反馈「风扇页不停刷新」）。
    // 风扇标注/隐藏/曲线等配置变更都是用户操作时即时触发 loadData 或局部刷新，不依赖 30s 重载。
    // 注意：fetchFanStatus 内部仍用 isFanPanelBusy() 决定是否覆盖徽标，故该函数保留。
  }
  if(DATA.time){
    document.querySelectorAll('.lastUpdate').forEach(lu=>{ lu.textContent='更新于 '+DATA.time+(DATA.elapsed!==undefined?' ('+DATA.elapsed+'s)':''); });
  }
}

function tempColor(t, trip){
  if(t==null) return 'var(--muted)';
  let pct = trip? t/trip : t/60;
  if(pct>0.9) return 'var(--red)';
  if(pct>0.75) return 'var(--orange)';
  return 'var(--green)';
}
function fmtHours(h){
  if(h==null) return '-';
  if(h>=8760) return (h/8760).toFixed(1)+' 年';
  return h+' 小时';
}

// 硬盘健康异常横幅：仅在「硬盘 SMART」页内展示，并给出处理引导（不再进全局告警横幅）
function diskHealthWarning(disks){
  var bad = (disks||[]).filter(function(d){ return d.health_ok===false; });
  if(!bad.length) return '';
  var items = bad.map(function(d){
    return '<li><b>'+esc(d.dev)+'</b>（'+esc(d.model||'未知型号')+'）：SMART 健康状态 <b style="color:var(--red)">'+esc(d.health||'异常')+'</b></li>';
  }).join('');
  return '<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:14px 16px;margin-bottom:14px">'
    + '<div style="font-weight:600;color:#b91c1c;margin-bottom:6px">⚠️ 检测到 '+bad.length+' 块硬盘健康异常</div>'
    + '<ul style="margin:0 0 8px 18px;padding:0;font-size:13px;line-height:1.7">'+items+'</ul>'
    + '<div style="font-size:13px;color:var(--text)">建议：<b>尽快备份</b>这块盘上的重要数据，并准备更换硬盘；在换新盘之前，避免往它上面写入关键文件。</div>'
    + '</div>';
}

  disks.forEach(d=>{ if(d.temp!=null) _maxT = (_maxT==null?d.temp:Math.max(_maxT,d.temp)); });

    } else if(isNVMe) {

// ===== 硬盘自检（A/B 双档）前端 =====
var DISK_TEST_JOBS = {};
var diskTestTimer = null;      // 本地 1 秒 elapsed 计时器
var diskTestPollTimer = null;  // 后端 3 秒状态轮询计时器
function fmtSec(s){ if(s==null) return '-'; if(s<60) return s+'秒'; var m=Math.floor(s/60), h=Math.floor(m/60); m=m%60; if(h) return h+'小时'+m+'分'; return m+'分'+(s%60)+'秒'; }
function renderDiskTest(d){
  var job = (DISK_TEST_JOBS || {})[d.dev];
  if(job && job.state === 'running'){
    var pct = job.progress!=null ? Math.min(100, Math.round(job.progress)) : 0;
    var prog = job.progress!=null
      ? '<div class="disk-test-progress"><div class="disk-test-progress-fill" style="width:'+pct+'%"></div></div>'
        + '<div class="disk-test-pct" style="text-align:right;font-size:12px;color:var(--primary);font-weight:600;margin-top:3px">'+pct+'%</div>'
      : '';
    var elapsedNow = job.started_at ? Math.max(0, Math.floor(Date.now()/1000 - job.started_at)) : (job.elapsed || 0);
    var etaHtml = '';
    if(job.started_at){
      if(job.progress!=null && job.progress>0){
        var _total = elapsedNow * 100 / job.progress;
        var _remain = Math.max(0, _total - elapsedNow);
        etaHtml = ' · 预计剩余 <span id="dt-eta-'+esc(d.dev)+'">'+fmtSec(_remain)+'</span> / 总用时约 '+fmtSec(_total);
      }else{
        var hint = job.eta_total_hint ? '参考总用时约 '+fmtSec(job.eta_total_hint) : '刚开始，进度更新较慢';
        etaHtml = ' · 预计剩余 <span id="dt-eta-'+esc(d.dev)+'">计算中…</span>（'+hint+'）';
      }
    }
    // 最小化：只留一行小条（盘名 + 进度），后台继续扫，可随时展开
    if(diskTestMin[d.dev]){
      return '<div class="disk-test-section disk-test-min">'
        +iconSvg('pulse')+'硬盘自检 <b>'+esc(d.dev)+'</b> · '+esc(jobTypeName(job.type))+' <span class="pct" id="dt-minpct-'+esc(d.dev)+'">'+pct+'%</span>'
        +'<button class="btn-mini" onclick="toggleDiskTestMin(\''+esc(d.dev)+'\',false)">展开</button>'
        +'<button class="btn-mini" onclick="abortDiskTest(\''+esc(d.dev)+'\')">中止</button>'
        +'<span class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></span>'
        +'</div>';
    }
    var isGrid = (job.type==='badblocks'||job.type==='surface');
    var gridHtml = isGrid
      ? surfaceGridHTML(d.dev, job)
        + '<div class="surface-legend">'
        + '<span><i class="sg-cell ok"></i>正常</span><span><i class="sg-cell"></i>未扫</span>'
        + '<span><i class="sg-cell bad"></i>坏块</span><span><i class="sg-cell cur"></i>扫描位置</span></div>'
      : '';
    return '<div class="disk-test-section">'
      +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检 · '+esc(jobTypeName(job.type))+' · '+esc(d.dev)
      +'<button class="btn-mini" style="margin-left:auto" onclick="toggleDiskTestMin(\''+esc(d.dev)+'\',true)" title="收起面板，后台继续扫描">最小化</button></div>'
      +'<div class="disk-test-msg">'+esc(job.message)+' · 已运行 <span id="dt-elapsed-'+esc(d.dev)+'">'+fmtSec(elapsedNow)+'</span>'+etaHtml+'</div>'
      +prog
      +gridHtml
      +'<div class="disk-test-actions"><button class="btn-mini" onclick="abortDiskTest(\''+esc(d.dev)+'\')">中止</button><span class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></span></div>'
    +'</div>';
  }
  if(job && (job.state === 'done' || job.state === 'error' || job.state === 'aborted')){
    var cls = job.state==='done'?'done':(job.state==='error'?'error':'');
    var result = '';
    if(job.result && job.result.read_errors!==undefined){
      result = ' · 读错误 '+job.result.read_errors+' / 写错误 '+job.result.write_errors+' / 可纠正 '+job.result.corrected;
    }
    if(job.bad_blocks && job.bad_blocks.length){
      result += ' · <b style="color:var(--danger)">坏块 '+job.bad_blocks.length+' 个</b>';
    }
    return '<div class="disk-test-section">'
      +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检 · '+(job.state==='done'?'完成':(job.state==='error'?'失败':'中止'))+'</div>'
      +'<div class="disk-test-msg '+cls+'">'+esc(job.message)+result+'</div>'
      +'<div class="disk-test-actions"><button class="btn-mini" onclick="clearDiskTest(\''+esc(d.dev)+'\')">清除</button></div>'
    +'</div>';
  }
  var modelArg = esc(d.model || '未知型号').replace(/'/g,"\\'");
  return '<div class="disk-test-section">'
    +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检</div>'
    +'<div class="disk-test-btns">'
      +'<button class="btn-mini" onclick="diskTestEntry(\''+esc(d.dev)+'\',\''+(d.standalone?'1':'0')+'\',\''+modelArg+'\')">硬盘自检</button>'
    +'</div>'
    +'<div class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></div>'
  +'</div>';
}
// 硬盘自检入口：一个按钮，点开按盘的情况给可选方式（在用盘不给清空式扫描）
function diskTestEntry(dev, standalone, model){
  var isStandalone = standalone === '1';
  appPick({
    title: '对 '+model+'（/dev/'+dev+'）执行哪种自检？',
    options: [
      {type:'long', label:'SMART 长自检（固件级）', desc:'由硬盘固件自检盘体逻辑健康，只读不伤数据，所有盘都能跑'},
      {type:'surface', label:'只读表面扫描', desc:'逐扇区读盘面找坏块，不写数据不伤盘，所有盘（含在用盘/阵列成员）都能跑，扫完看扇区网格'},
      {type:'badblocks', label:'全面坏块扫描（会清空数据）', desc:'写满整盘再读回校验，最彻底，但会清空盘上所有数据', disabled:!isStandalone, note: isStandalone?'':'该盘不是独立盘（在用/阵列成员），不能做清空式扫描'}
    ],

// 通用多选项弹窗（复用 app-modal 结构，body 放可点选项列表）
function appPick(opts){
  var modal = document.getElementById('app-modal');
  var titleEl = document.getElementById('app-modal-title');
  var bodyEl = document.getElementById('app-modal-body');
  var actionsEl = document.getElementById('app-modal-actions');
  if(!modal || !titleEl || !bodyEl || !actionsEl){ return; }
  function cleanup(){
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e){ if(e.key === 'Escape'){ cleanup(); } }
  titleEl.textContent = opts.title || '请选择';
  bodyEl.innerHTML = '';
  (opts.options||[]).forEach(function(o){
    var row = document.createElement('button');
    row.className = 'pick-opt' + (o.disabled ? ' pick-opt-disabled' : '');
    row.disabled = !!o.disabled;
    row.innerHTML = '<span class="pick-opt-t">'+esc(o.label)+'</span>'
      + '<span class="pick-opt-d">'+esc(o.desc||'')+'</span>'
      + (o.note ? '<span class="pick-opt-note">'+esc(o.note)+'</span>' : '');
    row.onclick = function(){ if(o.disabled){ return; } cleanup(); opts.onPick && opts.onPick(o.type); };
    bodyEl.appendChild(row);
  });
  actionsEl.innerHTML = '';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '取消';
  cancelBtn.onclick = function(){ cleanup(); };
  actionsEl.appendChild(cancelBtn);
  modal.onclick = function(e){ if(e.target === modal){ cleanup(); } };
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.addEventListener('keydown', onKey);
}
var diskTestMin = {};  // 扫描面板最小化状态：dev -> true/false（minimized 时只显示一行小条，后台继续扫）
function toggleDiskTestMin(dev, on){ diskTestMin[dev] = !!on; renderPanel('disks'); }
function jobTypeName(t){ return t==='surface'?'只读表面扫描':(t==='badblocks'?'坏块慢扫':'SMART 长自检'); }
// 哨兵式扇区网格：灰=未扫 / 绿=正常 / 红=坏块 / 黄=当前扫描位置（80x8=640 格，每格=盘容量/640）
function surfaceGridHTML(dev, job){
  var n = 640;
  var total = job.total_bytes || 0;
  var bs = job.blocksize || 4096;
  var pct = job.progress || 0;
  var green = total>0 ? Math.floor(pct/100*n) : 0;
  var badIdx = {};
  if(total>0 && job.bad_blocks && job.bad_blocks.length){
    var spanB = total/n;
    for(var i=0;i<job.bad_blocks.length;i++){
      var idx = Math.floor(job.bad_blocks[i]*bs/spanB);
      if(idx>=0 && idx<n) badIdx[idx]=true;
    }
  }
  var cells='';
  for(var c=0;c<n;c++){
    var cls='sg-cell';
    if(badIdx[c]) cls+=' bad';
    else if(c<green) cls+=' ok';
    else if(c===green) cls+=' cur';
    cells+='<i class="'+cls+'"></i>';
  }
  return '<div class="surface-grid" id="sg-'+esc(dev)+'">'+cells+'</div>';
}
async function startDiskTest(dev,type,model){
  model = model || '未知型号';
  if(type==='badblocks' && !await appConfirm({
    title: '确认对 '+model+' 执行 B 档坏块慢扫？',
    body: '目标磁盘：'+model+'（/dev/'+dev+'）\n\nB 类坏块慢扫会对该盘执行读写覆盖测试，这会擦除盘上所有数据，且耗时很长。\n请再次确认该盘为独立盘（未挂载、非 RAID/LVM 成员）。',
    danger: true,
    ok: '确定执行',
    cancel: '取消'
  })) return;
  if(type==='surface' && !await appConfirm({
    title: '确认对 '+model+' 执行 C 档只读表面扫描？',
    body: '目标磁盘：'+model+'（/dev/'+dev+'）\n\nC 档是只读表面扫描：只读取盘面数据判断能否正常读出，不写入任何数据、不会伤盘，可用于正在用的盘/阵列成员。\n但会持续读取整块盘，耗时较长，扫描期间该盘的 IO 会被占用。',
    ok: '开始扫描',
    cancel: '取消'
  })) return;
  var st=document.getElementById('dt-state-'+dev); if(st){ st.textContent='启动中…'; st.className='disk-test-msg'; }
  try{
    var r=await fetch('/api/disks/selftest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dev:dev,type:type,confirm:true})});
    var j=await r.json();
    if(st){ st.textContent=j.ok?'已启动':('失败：'+(j.error||'')); st.className=j.ok?'disk-test-msg':'disk-test-msg error'; }
    if(j.ok) pollDiskTests();
  }catch(e){ if(st){ st.textContent='请求失败'; st.className='disk-test-msg error'; } }
}
async function abortDiskTest(dev){
  try{
    var r=await fetch('/api/disks/selftest/abort',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dev:dev})});
    var j=await r.json();
    if(j.ok) pollDiskTests();
  }catch(e){}
}
function clearDiskTest(dev){
  if(DISK_TEST_JOBS) delete DISK_TEST_JOBS[dev];
  refreshPanel('disks');
}
function diskTestTick(){
  var any = false;
  for(var dev in DISK_TEST_JOBS){
    var job = DISK_TEST_JOBS[dev];
    if(job && job.state === 'running' && job.started_at){
      any = true;
      var s = Math.max(0, Math.floor(Date.now()/1000 - job.started_at));
      var el = document.getElementById('dt-elapsed-'+dev);
      if(el){ el.textContent = fmtSec(s); }
      var et = document.getElementById('dt-eta-'+dev);
      if(et){
        if(job.progress && job.progress>0){
          var tot = s * 100 / job.progress;
          et.textContent = fmtSec(Math.max(0, tot - s));
        }else{
          et.textContent = '计算中…';
        }
      }
      var mp = document.getElementById('dt-minpct-'+dev);
      if(mp && job.progress!=null){ mp.textContent = Math.min(100, Math.round(job.progress))+'%'; }
    }
  }
  if(!any && diskTestTimer){ clearInterval(diskTestTimer); diskTestTimer = null; }
}
async function pollDiskTests(){
  try{
    var r=await fetch('/api/disks/selftest?_='+Date.now());
    var j=await r.json();
    if(j.ok) DISK_TEST_JOBS = j.jobs || {};
  }catch(e){}
  if(currentTab()==='disks'){ renderPanel('disks'); }
  var hasRunning = Object.values(DISK_TEST_JOBS).some(function(jj){ return jj.state==='running'; });
  if(hasRunning && !diskTestTimer){ diskTestTimer = setInterval(diskTestTick, 1000); diskTestTick(); }
  if(diskTestPollTimer) clearTimeout(diskTestPollTimer);
  if(hasRunning) diskTestPollTimer = setTimeout(pollDiskTests, 3000);
}

function appConfirm(opts){
  opts = opts || {};
  return new Promise(function(resolve){
    var modal = document.getElementById('app-modal');
    var titleEl = document.getElementById('app-modal-title');
    var bodyEl = document.getElementById('app-modal-body');
    var actionsEl = document.getElementById('app-modal-actions');
    if(!modal || !titleEl || !bodyEl || !actionsEl){ resolve(false); return; }
    function cleanup(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e){
      if(e.key === 'Escape'){ cleanup(); resolve(false); }
      else if(e.key === 'Enter'){ cleanup(); resolve(true); }
    }
    titleEl.textContent = opts.title || '请确认';
    bodyEl.textContent = opts.body || opts.message || '';
    actionsEl.innerHTML = '';
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn';
    cancelBtn.textContent = opts.cancel || '取消';
    cancelBtn.onclick = function(){ cleanup(); resolve(false); };
    var okBtn = document.createElement('button');
    okBtn.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
    okBtn.textContent = opts.ok || '确定';
    okBtn.onclick = function(){ cleanup(); resolve(true); };
    actionsEl.appendChild(cancelBtn);
    actionsEl.appendChild(okBtn);
    modal.onclick = function(e){ if(e.target === modal){ cleanup(); resolve(false); } };
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    setTimeout(function(){ okBtn.focus(); }, 0);
    document.addEventListener('keydown', onKey);
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtLoad(v){ var n=parseFloat(v); return isNaN(n)?v:n.toFixed(2); }
// 双磁臂硬盘：把“同一序列号被系统拆成多个设备”的盘合并成一块显示（纯前端，后端数据不变，自检不受影响）
function parseSizeToB(s){
  if(!s) return 0;
  var m = String(s).match(/([\d.]+)\s*([TGM])B?/i);
  if(!m) return 0;
  var v = parseFloat(m[1]); var u = m[2].toUpperCase();
  return u==='T'? v*1e12 : u==='G'? v*1e9 : v*1e6;
}
function fmtBToSize(b){
  if(b>=1e12) return (b/1e12).toFixed(1)+'T';
  if(b>=1e9)  return Math.round(b/1e9)+'G';
  if(b>=1e6)  return Math.round(b/1e6)+'M';
  return '?';
}
function mergeDualActuator(list){
  if(!Array.isArray(list)) return list||[];
  var byKey = {}, out = [];
  list.forEach(function(d){
    var sn = (d.serial||'').trim().toUpperCase();
    if(!sn){ out.push(d); return; }            // 序列号为空绝不参与合并，避免误并
    var key = sn+'|'+(d.model||'')+'|'+(d.type||'').toUpperCase();
    (byKey[key] = byKey[key]||[]).push(d);
  });
  Object.keys(byKey).forEach(function(key){
    var arr = byKey[key];
    if(arr.length>1){
      var first = arr[0];
      var devs = arr.map(function(x){return x.dev;});
      var totalB = arr.reduce(function(s,x){return s+parseSizeToB(x.size);},0);
      var validTemps = arr.map(function(x){return x.temp;}).filter(function(x){return x!=null;});
      var merged = Object.assign({}, first);
      merged.dev = devs.join(' + ');
      merged.arms = devs;
      merged.dual_actuator = true;
      merged.size = fmtBToSize(totalB);
      merged.health_ok = arr.every(function(x){return x.health_ok;});
      merged.health = arr.some(function(x){return !x.health_ok;}) ? '异常' : (first.health||'OK');
      merged.temp = validTemps.length ? Math.max.apply(null, validTemps) : null;
      out.push(merged);
    } else {
      out.push(arr[0]);
    }
  });
  return out;
}
// 硬盘的特性标签清理：双磁臂已由专用 badge 展示，feature 里再出现“双磁臂(双执行器)”会造成重复
function diskFeatureClean(feat, isDualActuator){
  if(!feat) return '';
  if(isDualActuator) return '';
  return String(feat).replace(/双磁臂?\(双执行器\)|双执行器/g,'').trim();
}
// 传感器“电压”的中文友好名 + 解释（看不懂的给悬浮）
function voltNameCn(name, value){
  var n = (name||'').trim();
  var v = parseFloat(value);
  var map = {
    'VCORE':   {cn:'CPU 核心电压', tip:'CPU 内部核心的工作电压，会随负载自动微调'},
    'VCCIO':   {cn:'CPU IO 电压', tip:'CPU 输入输出接口的辅助电压'},
    'VCCSA':   {cn:'CPU 系统代理电压', tip:'CPU 内部缓存/内存控制器的辅助电压'},
    'VCCGT':   {cn:'核显电压', tip:'CPU 内置核显的工作电压'},

}

function pcieLocText(pci){
  // 把 01:00.0 这类机器地址翻成中文明文
  if(!pci) return '';
  let m = pci.match(/^([0-9a-f]{2}):([0-9a-f]{2})\.(\d)$/i);
  if(!m) return '主板 PCIe 扩展槽';
  let bus = parseInt(m[1],16), dev = parseInt(m[2],16), fn = parseInt(m[3],10);
  return `主板 PCIe 扩展槽（总线 ${bus} · 设备 ${dev}${fn?(' · 功能 '+fn):''}）`;
}
function fmtSpeed(bps){
  if(bps==null || isNaN(bps)) return '-';
  if(bps < 1024) return bps.toFixed(0) + ' B/s';
  if(bps < 1048576) return (bps/1024).toFixed(1) + ' KB/s';
  return (bps/1048576).toFixed(2) + ' MB/s';
}

function switchSysNic(idx){

// ===== 温度监控独立页面（关键温度阈值 + 主板测点温度墙）=====
function renderTemps(s){
  let sens = (s&&s.sensors) || {};
  // 温度墙实时化：优先统一温度快照（fetchTemps 每 5s 拉到 LAST_TEMPS.sensors/raid_temp），
  // 快照未就绪时回退页面数据（/api/all 或 /api/system 的 sensors）
  if(LAST_TEMPS && Array.isArray(LAST_TEMPS.sensors)){
    sens = {temps: LAST_TEMPS.sensors, fans: [], voltages: []};
  }
  // 主板测点全览墙（过滤无效 0°C / 负温）
  // 同时排除不直观/重复的测点：CPU PSS/CPU VRM（供电辅助，对用户无参考价值）、
  // PECI Agent 0 Calibration（CPU 内部校准值，正常人都看不懂）、内存温度 1/2（DIMM 一般没传感器）
  const EXCLUDE_TEMPS = new Set(['CPU PSS','CPU VRM','PECI Agent 0 Calibration','内存温度 1','内存温度 2','复合温度']);
  let tempEntries = (sens.temps||[]).filter(t=>typeof t.value==='number'&&t.value>0&&t.value<150 && !EXCLUDE_TEMPS.has(t.name));
  // 阵列卡芯片温度（ROC Temperature）：统一快照优先，回退页面数据
  let raidTemp = (LAST_TEMPS && typeof LAST_TEMPS.raid_temp==='number') ? LAST_TEMPS.raid_temp
              : (typeof s.raid_temp==='number') ? s.raid_temp
              : (DATA && DATA.raid && typeof DATA.raid.controller_temp==='number') ? DATA.raid.controller_temp
              : null;
  let raidEntry = (raidTemp!=null) ? {name:'阵列卡芯片温度', raw:'Controller Temperature (ROC)', value:raidTemp, max:80, crit:90} : null;
  let wallEntries = raidEntry ? tempEntries.concat([raidEntry]) : tempEntries;
  let wall = wallEntries.length?`<div class="temp-wall">${wallEntries.map(t=>{let raw=t.raw||'';let tip=raw?raw+'（原始测点名）':'';let star=(t.name==='CPU 封装温度')?' <span class="best-tag" title="CPU 内部传感器直读，最准确">★最准</span>':'';let trip=t.crit||t.max||85;return `<div class="temp-chip" title="${esc(tip)}"><span class="tc-name">${esc(t.name)}${star}</span><span class="tc-val" style="color:${tempColor(t.value, trip)}">${t.value}°C</span></div>`;}).join('')}</div>`:'<div class="loading">未检测到温度测点</div>';
  // 温度汇总：最高、平均、偏高/告警数量（与系统资源页的 CPU/内存解耦，避免重复）
  let maxTemp = null, avgTemp = null, warnCount = 0, critCount = 0;
  if(wallEntries.length){
    let sum = 0;
    wallEntries.forEach(t=>{
      sum += t.value;
      if(t.crit && t.value >= t.crit) critCount++;
      else if(t.max && t.value >= t.max) warnCount++;
      else if(t.value >= 85) warnCount++;
      if(maxTemp===null || t.value > maxTemp) maxTemp = t.value;
    });
    avgTemp = Math.round(sum / wallEntries.length);
  }
  let statusText = critCount ? `${critCount} 个临界` : warnCount ? `${warnCount} 个偏高` : '全部正常';
  let statusOk = !critCount && !warnCount;
  let stats = [
    {v:(cpuTempUnified()!=null?cpuTempUnified()+'°C':'N/A'),k:'CPU 温度',id:'hero-cpu-temp-temps',tip:'CPU 封装温度（Package id），CPU 内部传感器直读，最准确'},
    {v:(raidTemp!=null?raidTemp+'°C':'—'),k:'阵列卡温度',tip:'阵列卡芯片(ROC)温度，由 storcli 读取'},
    {v:(maxTemp!=null?maxTemp+'°C':'—'),k:'最高温度'},
    {v:(avgTemp!=null?avgTemp+'°C':'—'),k:'平均温度'}
  ];
  return `
  ${panelHero({icon:ICON_TEMPS,title:'温度监控',sub:'主板 / CPU / 芯片组 / 阵列卡 温度与阈值',badge:{ok:statusOk,text:statusText},stats:stats})}
  <div class="sys-grid">
    <div class="card" style="grid-column:1/-1">
      <h3 title="硬件能承受的温度上限，超过会降频保护">温度墙</h3>
      ${wall}
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">主板传感器测点 + 阵列卡芯片温度全览（已过滤无效 0°C / 负温）；鼠标悬停可查看原始英文名。颜色：绿正常 · 橙偏高 · 红危险</div>
    </div>
  </div>`;
}

function fmtDiskRows(diskio){
  return (diskio||[]).map(d=>{

    let badge = (d.standby)?' <span class="tag-sleep">待机</span>':'';
    let busy = (typeof d.busy==='number')?`<span class="disk-busy">占用 ${d.busy}%</span>`:'';

}

function renderFanControls(fans){
  let ctrls = (fans||[]).filter(f=>f.controllable).map(f=>{
    let id=fanUid(f.hwmon, f.idx);

    return `<div class="fan-ctrl" id="${id}-box">
      <div class="fan-ctrl-head"><span>${f.name}</span><span class="fan-ctrl-val"><span id="${id}-cur">${pct}</span>% <span class="fan-ctrl-tgt" id="${id}-tgt"></span></span></div>

        <span class="fan-ctrl-rpm">转速 <b id="${id}-rpm">${f.rpm||0}</b> RPM</span>

  return `<div class="fan-ctrl-list">${ctrls}</div>`;
}

// ===== 风扇控制独立页面（预设档位 + 实时转速卡片）=====
let FAN_LIST=[];
let SHOW_HIDDEN_FANS=false;
// 风扇卡片 DOM 唯一 ID：用 hwmon 路径 + idx 组合，避免不同 hwmon 芯片上 idx 重复导致 ID 撞车
// （重名风扇「改一个两个一起变、隐藏一个两个一起没」的根因）
function fanUid(hwmon, idx){ return 'fan_' + String(hwmon||'').split('/').pop() + '_' + (idx==null?'':idx); }
// 仅重渲染风扇面板（本地缓存 DATA，无需全量 loadData，避免点击「显示/隐藏通道」时卡顿等待整页刷新）
function refreshFanPanel(){
  let box=document.getElementById('fan');
  if(!box) return;
  box.innerHTML=renderFanControl();
  bindFanSliders();
}
function toggleShowHiddenFans(){ SHOW_HIDDEN_FANS=!SHOW_HIDDEN_FANS; refreshFanPanel(); }
// 判断风扇面板是否正处于「用户正在操作」状态：若为真则跳过整页重建，
// 避免 30s 自动刷新把正在编辑的曲线/休眠面板冲掉（与滑块拖动保护同源）。
// 用户最近一次在风扇面板里的操作时间（点按钮/改输入框/拖滑块），用于「正在操作就别刷新」判断。
// 说明：曲线编辑器改为「切到曲线模式即常显」后，原先用「曲线是否展开」当忙碌信号会永远为真，
// 会把 30s 自动刷新彻底冻住，因此改成基于最近操作时间的窗口判断。
var FAN_TOUCH_TS=0;
function markFanTouch(){ FAN_TOUCH_TS=Date.now(); }
function isFanPanelBusy(){
  var a=document.activeElement;
  if(a && a.classList && (a.classList.contains('fan-slider')||a.classList.contains('fan-custom-input'))) return true;
  // 焦点还停在风扇卡里的任意输入控件上（曲线节点、阈值、名称等）
  if(a && a.closest && a.closest('.fan-card') && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName||'')) return true;
  // 最近 60 秒在风扇面板里动过手：视为正在配置，先别整页重建
  if(FAN_TOUCH_TS && (Date.now()-FAN_TOUCH_TS) < 60000) return true;
  // 硬盘休眠联动面板处于展开状态
  var sb=document.getElementById('sleep-panel-body');
  if(sb && sb.style.display==='block') return true;
  return false;
}

  let presetHtml=presets.map(p=>`<button class="preset-btn ${p[0]==='100'?'full':''}" data-preset="${p[0]}" onclick="applyFanPreset('${p[0]}')">${p[1]}</button>`).join('');
  let cards=fans.map(f=>{
    let id=fanUid(f.hwmon, f.idx);

    // 3 按钮：当前激活态由后端 active_mode 决定

    let activeBtn = isManual ? 'manual' : (f.active_mode || (f.mode==='curve'?'curve':'linear'));
    let noCurve = !f.has_curve;
    // pill 直接说人话：当前这台风扇到底按哪套逻辑在转（含温度源），而不是内部 mode 代号
    let _pi = fanPillInfo(f);

        <span class="fan-label-save">
          <select class="fan-volt-select" id="${id}-volt" title="风扇供电电压">
            <option value="12V" ${f.voltage==='12V'?'selected':''}>12V</option>

// ===== 风扇 自动/手动 分段开关 + 极简硬盘休眠联动面板（stage2）=====
// 风扇接管总开关：关闭后 nasdash 仅监控、不写 PWM，控速交还系统原生（BIOS/BMC/主板自动）
var FAN_CTRL_ENABLED = true;
var FAN_CTRL_CHANGING = false; // 开关操作进行中，禁止轮询/同步把状态刷回旧值
var FAN_CTRL_TIMER = null;     // 开关兜底解锁定时器
// 仅局部更新「接管锁定态」视觉（横幅/面板 class），不整面板重绘——
// 否则每次切开关都会触发整面板重绘，造成风扇卡片闪烁、滑块与编辑状态被打断。
function applyFanLockVisual(){
  // 纯视觉更新，任何异常都不能冒泡出去——否则会打断 setFanControl 里后续的 fetch，
  // 导致请求没发出、CHANGING 卡死、开关 disabled 再也不复位（表现为「开关点不动」）。
  try{
    var fp=document.getElementById('fan'); if(!fp) return;
    var page=fp.querySelector('.fan-page');
    if(page) page.classList.toggle('fan-locked', !FAN_CTRL_ENABLED);
    var banner=fp.querySelector('.fan-lock-banner');
    if(!FAN_CTRL_ENABLED){
      if(!banner && page){
        banner=document.createElement('div');
        banner.className='fan-lock-banner';
        banner.innerHTML=iconSvg('alert')+' 风扇接管已关闭：nasdash 不再根据温度自动调速。若飞牛自带风扇服务已配置好，会由它接管；否则保持当前转速。开启上方「接管风扇控制」才能用下方调速。';
        // 必须挂到 .fan-page 下（渲染时 ${_lock} 就是 .fan-page 的第一个子节点）。
        // 早期写成 fp.insertBefore(banner, .fan-grid)——.fan-grid 不是 #fan 的直接子节点，必抛 NotFoundError。
        page.insertBefore(banner, page.firstChild);
      }
    } else if(banner){ banner.remove(); }
  }catch(e){ /* 视觉降级即可，绝不阻断开关逻辑 */ }
}
// 开关兜底解锁：无论成功/失败/异常/超时，都必须把「操作中」标志与 disabled 复位
function releaseFanCtrlLock(){
  FAN_CTRL_CHANGING=false;
  if(FAN_CTRL_TIMER){ clearTimeout(FAN_CTRL_TIMER); FAN_CTRL_TIMER=null; }
  // 面板可能在请求期间被重绘过，必须重新取元素，不能用调用前缓存的旧引用
  var el=document.getElementById('fanCtrlToggle');
  if(el) el.disabled=false;
}
function setFanControl(on){
  if(FAN_CTRL_CHANGING) return; // 上一次还没落定，忽略连点
  var t=document.getElementById('fanCtrlToggle');
  // 乐观更新：先按目标状态立即改锁定态视觉，开关瞬间响应，等 POST 结果再微调；
  // 不整面板重绘，避免风扇卡片闪烁、打断正在编辑的滑块/曲线。
  FAN_CTRL_ENABLED=on;
  FAN_CTRL_CHANGING=true; // 操作期间禁止轮询把状态刷回旧值
  if(t){ t.disabled=true; }
  applyFanLockVisual(); // 内部已 try/catch，不会阻断下面的请求
  // 兜底看门狗：极端情况（请求被网关吞掉、页面切后台）也要在 10s 后解锁，永不卡死
  FAN_CTRL_TIMER=setTimeout(function(){ releaseFanCtrlLock(); refreshFanControlState(); }, 10000);
  fetch('/api/fan/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:on})})
    .then(function(r){return r.json();})
    .then(function(d){
      releaseFanCtrlLock();
      var el=document.getElementById('fanCtrlToggle');
      if(d && d.ok){ FAN_CTRL_ENABLED=on; if(el) el.checked=on; applyFanLockVisual(); }
      else { FAN_CTRL_ENABLED=!on; if(el) el.checked=!on; applyFanLockVisual(); alert('操作失败：'+((d&&d.error)||'未知错误')); }
    })
    .catch(function(e){
      releaseFanCtrlLock();
      var el=document.getElementById('fanCtrlToggle');
      FAN_CTRL_ENABLED=!on; if(el) el.checked=!on; applyFanLockVisual(); alert('网络错误，请重试');
    });
}
function refreshFanPanel(){
  var fp=document.getElementById('fan'); if(!fp) return;
  // 用户正在输入/操作表单控件时跳过重建：autoRefreshTick 每 30s 会进来，
  // 若此时重建 innerHTML，正在输入的数字框会被换掉 -> 「框能点但输不进字」。
  var ae=document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='SELECT' || ae.tagName==='TEXTAREA')) return;
  fp.innerHTML=renderFanControl(); bindFanSliders();
}
var FAN_CTRL_SYNCING = false; // 同步请求在途，避免面板重绘时叠发多个请求
function refreshFanControlState(){
  // 用户正在切开关时，后端状态可能还没落定，此时同步会把它刷回旧状态造成「跳回」。
  if(FAN_CTRL_CHANGING || FAN_CTRL_SYNCING) return;
  FAN_CTRL_SYNCING=true;
  fetch('/api/fan/control?_='+Date.now()).then(function(r){return r.json();}).then(function(d){
    FAN_CTRL_SYNCING=false;
    if(FAN_CTRL_CHANGING) return;
    var en=!!(d&&d.enabled);
    if(en!==FAN_CTRL_ENABLED){ FAN_CTRL_ENABLED=en; refreshFanPanel(); }
  }).catch(function(){ FAN_CTRL_SYNCING=false; });
}
function syncFanData(hwmon, idx, mode){
  if(DATA && DATA.system && DATA.system.sensors && DATA.system.sensors.fans){
    DATA.system.sensors.fans.forEach(function(ff){ if(ff.hwmon===hwmon && ff.idx===idx){ ff.mode=mode; } });
  }
}

function fanSrcLabel(v){
  if(!v) return '';

var FAN_ZERO_SINCE={};

function updateFanFloorNote(id, f){
  var el=document.getElementById(id+'-hwnote');
  if(!el) return;
  // pwm_enable==1 才是 nasdash 真正在控速；==2 是已交还主板自动，
  // 那种情况下读到的 0 不是我们下发的，不能算「我让它停它不停」，否则误报。
  var engaged = (f && (f.pwm_enable==1 || f.pwm_enable==='1'));
  var zeroButSpinning = f && engaged && f.has_tach && (f.pwm!=null && f.pwm<=0) && (f.rpm>0);
  if(zeroButSpinning){
    FAN_HIDE_SINCE[id]=0;
    if(!FAN_ZERO_SINCE[id]) FAN_ZERO_SINCE[id]=Date.now();
    // 风扇从高转降到停需要几秒惯性，8 秒后仍在转才判定为「硬件停不下来」
    if(Date.now()-FAN_ZERO_SINCE[id] < 8000) return;
    el.style.display='flex';
    // 摘要：固定文案，不写实时 rpm，避免硬件在「0 ↔ 下限」间抖时这行字跟着闪
    var sum=document.getElementById(id+'-hwsum');
    if(sum) sum.innerHTML=iconSvg('alert')+' 已下发 0%，但此风扇仍在转（硬件最低转速保护，软件停不下来）';
    var d=document.getElementById(id+'-hwdetail');
    if(d){
      d.style.display = FAN_HW_EXPANDED[id] ? 'block' : 'none';
      d.innerHTML='多为风扇自带最低转速保护或主板对该接口锁了下限，属<b>硬件限制</b>，软件无法再降。'
        +'<b>临时绕过：</b>把该风扇「低于开转温度即停转（强制 0%）」的勾去掉，温度低时降到 min_pwm 即可，不再卡在尴尬的中间转速。'
        +'<b>真正停转：</b>进 BIOS 找 Fan Stop / 0 RPM 相关选项，或更换支持 0 转停转的风扇。';
    }
    var t=document.getElementById(id+'-hwtoggle');
    if(t) t.textContent = FAN_HW_EXPANDED[id] ? '收起 ▴' : '说明 ▾';
  } else {
    FAN_ZERO_SINCE[id]=0;
    if(el.style.display!=='none'){
      // 当前显示中：记退场时间，1.5s 后才真正隐藏（防硬件在「0 ↔ 下限」间抖时反复闪）
      if(!FAN_HIDE_SINCE[id]) FAN_HIDE_SINCE[id]=Date.now();
      if(Date.now()-FAN_HIDE_SINCE[id] < 1500) return;
    }
    FAN_HIDE_SINCE[id]=0;
    el.style.display='none';
  }
}
// 状态标签的唯一真源：整页渲染(renderFanControl)与 2 秒轮询(fetchFanStatus)必须共用这一份，

function fanPillInfo(f){
  if(!f) return {txt:'', cls:'b-info'};
  if(f.mode==='manual' || f.manual_active) return {txt:'手动固定', cls:'b-warn'};
  if(!f.rule) return {txt:'未设温控', cls:'b-muted'};
  var am = f.active_mode || (f.mode==='curve' ? 'curve' : 'linear');
  if(am==='curve' && !f.has_curve) return {txt:'曲线温控（待设曲线）', cls:'b-muted'};
  var src = fanSrcLabel(f.rule_source);
  return {txt:(am==='curve'?'曲线温控':'线性温控') + (src?('·'+src):''), cls:'b-info'};
}
async function setFanMode(hwmon, idx, mode){
  // mode: 'linear' / 'curve' / 'manual'
  markFanTouch();
  var id=fanUid(hwmon, idx);
  var seg=document.getElementById(id+'-seg');
  if(seg){ seg.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===mode); }); }
  var linearBox=document.getElementById(id+'-linear');
  var curveBox=document.getElementById(id+'-curve');
  var manBox=document.getElementById(id+'-manual');
  // 先全部隐藏
  if(linearBox) linearBox.style.display='none';
  if(curveBox) curveBox.style.display='none';
  if(manBox) manBox.style.display='none';

  if(mode==='manual'){
    if(manBox) manBox.style.display='block';
    var sl=document.getElementById(id+'-slider');
    var cust=document.getElementById(id+'-custom');
    var v=sl?parseInt(sl.value,10):(cust?parseInt(cust.value,10):50);
    if(isNaN(v)) v=50;
    await applyFan(hwmon, idx, v);
    syncFanData(hwmon, idx, 'manual');
    setFanPill(id, '手动固定', 'b-warn');
  } else if(mode==='linear'){
    if(linearBox) linearBox.style.display='block';
    await setFanAuto(hwmon, idx, 'linear');
    syncFanData(hwmon, idx, 'auto');
    var lsel=document.getElementById(id+'-linear_rsrc');
    var lsrc=lsel?fanSrcLabel(lsel.value):'';
    setFanPill(id, lsrc?('线性温控·'+lsrc):'未设温控', lsrc?'b-info':'b-muted');
  } else if(mode==='curve'){
    if(curveBox){
      curveBox.style.display='block';
      // 首次展开时初始化曲线节点表格（DOM 已由 fanRuleCurveBody 渲染好，只需画点 + 曲线）
      var cdata=document.getElementById(id+'-r-curve-data');
      if(cdata && (!cdata.value || cdata.value==='[]' || cdata.value==='null')){
        // 第一次展开：若数据为空，留空表格让用户主动添加节点
        renderCurvePoints(id+'-r');
        drawCurve(id+'-r');
      } else if(cdata){
        renderCurvePoints(id+'-r');
        drawCurve(id+'-r');
      }
    }
    // 切换 active_mode='curve' 前先校验曲线 ≥2 节点，否则后端会回退到线性
    var pts=readCurve(id+'-r');
    if(pts.length<2){
      // 没曲线：提示用户先设曲线，但仍切到「曲线」按钮（让用户能继续编辑）
      setFanPill(id, '曲线温控（待设曲线）', 'b-muted');
    } else {
      await setFanAuto(hwmon, idx, 'curve');
      syncFanData(hwmon, idx, 'auto');
      var csel=document.getElementById(id+'-curve_rsrc');
      var csrc=csel?fanSrcLabel(csel.value):'';
      setFanPill(id, csrc?('曲线温控·'+csrc):'曲线温控', 'b-info');
    }
  }
}
