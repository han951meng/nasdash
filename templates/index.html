<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function(){try{var t=localStorage.getItem('nasdash_theme');var dark;if(t==='dark'){dark=true;}else if(t==='light'){dark=false;}else{var fn=null;try{var f=localStorage.getItem('fnos-theme-mode');if(f==='dark'||f==='light')fn=f;}catch(e){}if(!fn){try{var p=new URLSearchParams(location.search).get('fnos-theme-mode');if(p==='dark'||p==='light')fn=p;}catch(e){}}if(!fn){try{if(window.parent&&window.parent!==window){var pp=new URLSearchParams(window.parent.location.search).get('fnos-theme-mode');if(pp==='dark'||pp==='light')fn=pp;}}catch(e){}}dark=(fn==='dark')?true:((fn==='light')?false:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));}document.documentElement.setAttribute('data-theme',dark?'dark':'light');}catch(e){}})();
</script>
<title>飞牛 NAS 硬件监控</title>
<style>
  :root{
    color-scheme:light;
    /* ===== fnOS Semi Design 真实设计变量（飞牛真值，仿 Semi Design 色阶） ===== */
    --semi-grey-0:250,250,250; --semi-grey-1:243,243,243; --semi-grey-2:194,195,196; --semi-grey-3:159,160,161; --semi-grey-4:124,125,127; --semi-grey-5:90,91,92; --semi-grey-6:75,75,75; --semi-grey-7:48,48,48; --semi-grey-8:30,30,33; --semi-grey-9:11,11,12;
    --semi-brand-0:230,244,255; --semi-brand-1:215,237,255; --semi-brand-2:171,219,255; --semi-brand-3:117,191,255; --semi-brand-4:51,133,255; --semi-brand-5:0,102,255; --semi-brand-6:0,94,235; --semi-brand-7:0,67,184; --semi-brand-8:0,45,112; --semi-brand-9:0,31,77;
    --semi-green-4:35,177,120; --semi-green-5:0,158,97;
    --semi-amber-4:255,125,0; --semi-amber-5:255,154,46;
    --semi-red-4:226,96,82; --semi-red-5:219,56,44;
    /* 派生语义色（对齐飞牛真值） */
    --c-bg:#F7F8FA;
    --c-bg-1:#FFFFFF;
    --c-card:#FFFFFF;
    --c-text-0:rgba(var(--semi-grey-9),1);
    --c-text-1:rgba(var(--semi-grey-9),.75);
    --c-text-2:rgba(var(--semi-grey-9),.5);
    --c-text-3:rgba(var(--semi-grey-9),.25);
    --c-border:rgba(var(--semi-grey-9),.12);
    --c-fill-0:rgba(var(--semi-grey-9),.04);
    --c-fill-1:rgba(var(--semi-grey-9),.06);
    --c-fill-2:rgba(var(--semi-grey-9),.12);
    --c-primary:rgba(var(--semi-brand-5),1);
    --c-primary-hover:rgba(var(--semi-brand-6),1);
    --c-primary-active:rgba(var(--semi-brand-7),1);
    --c-primary-bg:rgba(var(--semi-brand-5),.10);
    --c-success:rgba(var(--semi-green-5),1);
    --c-warning:rgba(var(--semi-amber-5),1);
    --c-danger:rgba(var(--semi-red-5),1);
    --c-shadow:0 1px 2px rgba(var(--semi-grey-9),.05);
    /* 圆角（Semi: sm3 / md6 / lg12） */
    --r-sm:3px; --r-md:6px; --r-lg:12px; --r-xl:16px; --r-round:999px;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px; --s-6:24px; --s-8:32px;
    /* 兼容别名：现有 JS / CSS 继续用旧名，无缝飞牛化 */
    --blue:var(--c-primary); --green:var(--c-success); --orange:var(--c-warning); --red:var(--c-danger); --yellow:#CA8A04;
    --primary:var(--c-primary); --primary-hover:var(--c-primary-hover); --primary-active:var(--c-primary-active);
    --success:var(--c-success); --warning:var(--c-warning); --danger:var(--c-danger);
    --text-1:var(--c-text-0); --text-2:var(--c-text-1); --text-3:var(--c-text-2); --text-4:var(--c-text-3);
    --border:var(--c-border); --divider:var(--c-fill-1); --fill:var(--c-fill-1);
    --bg:var(--c-bg); --card:var(--c-card);
    --shadow:var(--c-shadow); --shadow-hover:0 4px 12px rgba(var(--semi-grey-9),.08);
    /* ===== 状态语义色（badge / log / pill / 健康度，明暗分别取值） ===== */
    --status-ok:#0A8C20; --status-ok-bg:rgba(0,180,42,.12); --status-ok-solid:#22c55e;
    --status-warn:#C85A00; --status-warn-bg:rgba(255,125,0,.12); --status-warn-solid:#f59e0b;
    --status-err:#C7392F; --status-err-bg:rgba(245,63,63,.12); --status-err-solid:#ef4444;
    --link:#2a6fd6; --link-hover:#1d5fc0;
    --scrim:rgba(15,23,42,.4);
    /* ===== 图表 / 数据可视化系列色（主题无关，明暗同值） ===== */
    --series-cpu:#4aa3ff; --series-mem:#a855f7; --series-temp:#ff7a59;
    --series-net:#3ec97a; --series-up:#ffb020; --series-purple:#b07cff;
    --series-cyan:#38bdf8; --series-disk:#4aa3ff;
    --chart-grid:rgba(128,128,128,.15); --chart-axis:#8a93a6;
    --glow-brand:rgba(117,191,255,.05);
    /* ===== 品牌 / 状态 / 光晕 tint 色阶（值不变，仅收敛字面量为变量，明暗同值可继承） ===== */
    --tint-brand-06:rgba(117,191,255,.06);
    --tint-brand-14:rgba(117,191,255,.14);
    --tint-brand-24:rgba(117,191,255,.24);
    --glow-brand-25:rgba(57,125,255,.25);
    --tint-err-08:rgba(245,63,63,.08);
    --tint-err-40:rgba(245,63,63,.40);
    --tint-err-10:rgba(224,57,74,.10);
    --tint-err2-12:rgba(229,72,77,.12);
    --tint-err3-12:rgba(239,68,68,.12);
    --glow-red-25:rgba(220,53,69,.25);
    --glow-red-28:rgba(185,28,28,.28);
    --tint-amber-10:rgba(245,158,11,.10);
    --tint-amber-15:rgba(245,158,11,.15);
    --tint-amber-35:rgba(245,158,11,.35);
    --tint-warn-10:rgba(196,123,0,.10);
    --tint-warn2-12:rgba(180,83,9,.12);
    --glow-orange-28:rgba(234,88,12,.28);
    --tint-ok3-10:rgba(34,197,94,.10);
    --tint-cyan-10:rgba(56,189,248,.10);
    --tint-cyan-35:rgba(56,189,248,.35);
    --tint-blue-12:rgba(120,170,255,.12);
    --scrim-modal:rgba(11,11,12,.45);
    --chart-grid-18:rgba(128,128,128,.18);
    --skeleton-1:rgba(128,128,128,.12);
    --skeleton-2:rgba(128,128,128,.22);
    --text:var(--text-1); --muted:var(--text-3);
  }
  [data-theme="dark"]{
    color-scheme:dark;
    /* 暗色：翻转色阶（同 Semi Design 机制） */
    --c-bg:#1A1E23;
    --c-bg-1:#23262B;
    --c-card:#23262B;
    --c-text-0:rgba(255,255,255,.92);
    --c-text-1:rgba(255,255,255,.65);
    --c-text-2:rgba(255,255,255,.45);
    --c-text-3:rgba(255,255,255,.28);
    --c-border:rgba(255,255,255,.12);
    --c-fill-0:rgba(255,255,255,.04);
    --c-fill-1:rgba(255,255,255,.06);
    --c-fill-2:rgba(255,255,255,.12);
    --c-primary:rgba(117,191,255,1);
    --c-primary-hover:rgba(145,205,255,1);
    --c-primary-active:rgba(86,170,255,1);
    --c-primary-bg:rgba(117,191,255,.14);
    --c-success:rgba(43,201,106,1);
    --c-warning:rgba(255,154,46,1);
    --c-danger:rgba(247,105,101,1);
    --c-shadow:0 1px 3px rgba(0,0,0,.3);
    --blue:var(--c-primary); --green:var(--c-success); --orange:var(--c-warning); --red:var(--c-danger); --yellow:#FFD60A;
    --primary:var(--c-primary); --primary-hover:var(--c-primary-hover); --primary-active:var(--c-primary-active);
    --success:var(--c-success); --warning:var(--c-warning); --danger:var(--c-danger);
    --text-1:var(--c-text-0); --text-2:var(--c-text-1); --text-3:var(--c-text-2); --text-4:var(--c-text-3);
    --border:var(--c-border); --divider:var(--c-fill-1); --fill:var(--c-fill-1);
    --bg:var(--c-bg); --card:var(--c-card);
    --shadow:var(--c-shadow); --shadow-hover:0 4px 12px rgba(0,0,0,.4);
    --status-ok:#5fd98a; --status-ok-bg:rgba(0,200,120,.14); --status-ok-solid:#4ade80;
    --status-warn:#ffb56b; --status-warn-bg:rgba(255,154,46,.14); --status-warn-solid:#fbbf24;
    --status-err:#ff8a85; --status-err-bg:rgba(247,105,101,.16); --status-err-solid:#f87171;
    --link:#7cb3ff; --link-hover:#a9d4ff;
    --scrim:rgba(15,23,42,.4);
    --chart-grid:rgba(255,255,255,.12); --chart-axis:#9aa1ad;
    --text:var(--text-1); --muted:var(--text-3);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .header{display:none} /* 桌面去掉置顶栏；汉堡按钮仅在移动端显示 */
  .hd-time{color:var(--text-3);font-size:12px;margin-right:2px}
  .hd-sep{width:1px;height:16px;background:var(--border);margin:0 2px}
  .ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icon-btn .ico{width:15px;height:15px;vertical-align:-2px}
  .icon-btn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;border-radius:var(--r-md);cursor:pointer;font-size:14px;color:var(--text-2);transition:.15s;line-height:1}
  .icon-btn:hover{background:var(--c-fill-1);color:var(--text-1)}
  .icon-btn.themeToggle.is-auto{border-color:var(--c-primary);color:var(--c-primary)}
  .container{max-width:1600px;margin:0 auto;padding:18px 20px;display:flex;gap:16px;align-items:flex-start}
  .sidebar{width:208px;flex:0 0 208px;background:var(--card);border:1px solid var(--border);box-shadow:var(--c-shadow);border-radius:var(--r-md);padding:10px 8px;position:sticky;top:18px;will-change:transform;max-height:calc(100vh - 36px);overflow-y:auto;overscroll-behavior:contain}
  /* 滚动条：占位常驻（不抖），thumb 永远真透明（完全看不见，无论滚不滚） */
  .sidebar,html{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .sidebar::-webkit-scrollbar,html::-webkit-scrollbar{width:8px;height:8px}
  .sidebar::-webkit-scrollbar-thumb,html::-webkit-scrollbar-thumb{background:transparent;border-radius:4px}
  .sidebar::-webkit-scrollbar-track,html::-webkit-scrollbar-track{background:transparent}
  .sidebar-title{font-size:12px;color:var(--text-3);letter-spacing:.3px;padding:2px 10px 8px}
  .sb-group{font-size:11px;color:var(--text-3);padding:12px 10px 4px;letter-spacing:.3px;margin-top:4px}
  .sb-group:first-of-type{margin-top:0}
  .tabs{display:flex;flex-direction:column;gap:2px}
  .tab{width:100%;padding:9px 12px;text-align:left;cursor:pointer;border-radius:var(--r-md);font-size:14px;font-weight:400;color:var(--text-1);transition:background .15s,color .15s;border:none;background:none;display:flex;align-items:center;gap:10px;position:relative}
  .tab svg.ic,.tab img.ic,.hero-ic svg.ic,.hero-ic img.ic{width:30px;height:30px;flex:none;display:block;object-fit:contain}
  .hero-ic img.ic{width:48px;height:48px}
  /* 图标透明背景：直接浮在页面背景上，暗色下不会有白色底板 */
  .tab img.ic,.hero-ic img.ic{background:transparent;border-radius:0;padding:0;box-shadow:none}
  .tab:hover{background:var(--c-fill-1)}
  .tab.active{background:var(--c-card);color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12);border-left:3px solid var(--primary);padding-left:9px}
  .content{flex:1;min-width:0}
  .panel{display:none}
  /* 移动端抽屉导航（桌面隐藏，仅手机显示汉堡按钮） */
  .menu-toggle{display:none}
  .nav-overlay{display:none;position:fixed;inset:0;background:var(--scrim);z-index:45}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(var(--semi-grey-9),.45);z-index:10000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
  .modal-overlay.show{display:flex}
  .modal-box{width:100%;max-width:420px;background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--r-lg);box-shadow:var(--shadow-hover);padding:22px 24px 20px;display:flex;flex-direction:column;gap:14px;animation:modalIn .18s ease}
  @keyframes modalIn{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .modal-title{font-size:16px;font-weight:600;color:var(--text-1)}
  .modal-body{font-size:14px;color:var(--text-1);line-height:1.7;white-space:pre-line}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
  .modal-overlay .btn{min-width:72px}
  .modal-box.modal-wide{max-width:min(1000px, calc(100vw - 32px));width:100%}
.modal-overlay.modal-wide .modal-box{max-width:min(1000px, calc(100vw - 32px));width:100%}
/* 自检历史表格：grid 固定列宽，中文 nowrap + 溢出省略；只有说明列允许换行 */
.hist-head,.hist-row{display:grid;grid-template-columns:48px 120px 60px 80px 90px 1fr 140px;column-gap:12px;align-items:center;font-size:13px;padding:8px 4px}
.hist-head{font-size:12px;color:var(--text-3);font-weight:600;border-bottom:1px solid var(--border)}
.hist-row{border-bottom:1px solid var(--border);color:var(--text-1)}
.hist-row .c1{font-weight:700}
.hist-row .c2,.hist-row .c3,.hist-row .c4,.hist-row .c5,.hist-row .c7{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row .c6{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.hist-foot{padding:10px 4px 0;font-size:12px;color:var(--text-3)}
  .logstat{margin-bottom:10px;font-size:13px;color:var(--text-1)}
  .logstat b{font-size:13px;margin:0 2px}
  .logstat b.danger{color:var(--status-err-solid)}
  .logstat b.warn{color:var(--status-warn-solid)}
  .log-list{border:1px solid var(--c-border);border-radius:8px;max-height:min(480px, 58vh);overflow:auto;background:var(--c-fill-2)}
  .log-line{font-family:Consolas,Menlo,monospace;font-size:12px;padding:5px 12px;border-bottom:1px solid var(--c-border);white-space:pre-wrap;word-break:break-all;line-height:1.55;color:var(--text-1)}
  .log-line:last-child{border-bottom:none}
  .log-line .lt{color:var(--muted);margin-right:8px;font-size:11px}
  .log-line.lv-err{background:var(--tint-err-10);color:var(--status-err-solid)}
  .log-line.lv-warn{background:var(--tint-warn-10);color:var(--status-warn-solid)}
  .log-empty{padding:18px 12px;color:var(--muted);text-align:center;font-size:13px}
  .panel.active{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{background:var(--card);border-radius:var(--r-md);padding:var(--s-4);box-shadow:var(--shadow);border:1px solid var(--border);transition:box-shadow .2s}
  .card h3{font-size:13px;color:var(--text-3);margin-bottom:10px;font-weight:600;letter-spacing:.3px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;border-bottom:1px solid var(--divider);gap:12px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex:0 0 auto;max-width:60%}
  .kv .v{font-weight:500;text-align:right;word-break:break-all;flex:1;min-width:0}
  .badge{display:inline-block;padding:2px 10px;border-radius:var(--r-sm);font-size:12px;font-weight:600}
  .b-ok{background:var(--status-ok-bg);color:var(--status-ok)}
  .b-warn{background:var(--status-warn-bg);color:var(--status-warn)}
  .b-bad{background:var(--status-err-bg);color:var(--status-err)}
  .tag-sleep{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:var(--r-sm);font-size:11px;font-weight:600;background:var(--status-ok-bg);color:var(--status-ok);vertical-align:middle}
  .disk-busy{display:block;font-size:11px;color:var(--text-3);margin-top:2px;font-weight:400}
  .b-info{background:var(--c-primary-bg);color:var(--primary)}
  .b-muted{background:var(--fill);color:var(--text-3)}
  .disk-card{position:relative}
  .disk-card.bad{border-color:var(--red);background:#fef2f2}
  .disk-card.warn{border-color:var(--orange)}
  .disk-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .disk-head .name{font-size:16px;font-weight:600}
  .temp-bar{height:6px;border-radius:3px;background:var(--fill);margin:8px 0;overflow:hidden}
  .temp-fill{height:100%;border-radius:3px;transition:width .3s}
  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--divider)}
  .table th{color:var(--text-3);font-weight:500;background:var(--fill)}
  .table tr:hover{background:var(--fill)}
  .table td{color:var(--text-2)}
  .progress{height:20px;background:var(--fill);border-radius:10px;overflow:hidden;position:relative}
  .progress-fill{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:600}
  .btn{border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 16px;font-size:14px;cursor:pointer;transition:.2s;font-weight:500;background:transparent;color:var(--text-2)}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
  .btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn-danger:hover{opacity:.9}
  .btn-ghost{background:transparent;color:var(--primary);border-color:transparent}
  .btn-ghost:hover{background:var(--c-primary-bg)}
  .switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  .switch input{display:none}
  .slider{width:34px;height:18px;background:var(--border);border-radius:10px;position:relative;transition:.2s}
  .slider:before{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .switch input:checked+.slider{background:var(--success)}
  .switch input:checked+.slider:before{transform:translateX(16px)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{text-align:center;padding:40px;color:var(--muted)}
  .skeleton{background:linear-gradient(90deg,rgba(128,128,128,.12) 25%,rgba(128,128,128,.22) 37%,rgba(128,128,128,.12) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px}
  @keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--card)}
  .sk-line{height:13px;margin:12px 0;border-radius:6px}
  pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:8px;font-size:12px;overflow-x:auto;max-height:400px;white-space:pre-wrap}
  .section-title{font-size:15px;font-weight:600;margin:18px 0 10px;color:var(--text)}
  .cc-schedule{margin-top:8px}
  .cc-sched-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
  .switch-row{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  .lvl-matrix{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .lvl-row{display:grid;grid-template-columns:120px repeat(4,1fr);align-items:center;gap:8px;font-size:13px}
  .lvl-row.lvl-head{font-weight:600;color:var(--muted)}
  .hs-list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .hs-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .hs-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
  .cb-block{margin-top:6px;font-size:13px}
  .cb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .cb-status{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .cb-active{font-size:12px;color:var(--danger);font-weight:600}
  .cb-needed{font-size:12px;color:var(--orange)}
  .cb-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .pill{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;margin-left:6px}
  .pill.gray{background:var(--fill);color:var(--text-3)}
  .pill.red{background:var(--status-err-bg);color:var(--danger)}
  .pill.green{background:var(--status-ok-bg);color:var(--success)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .split-col{display:flex;flex-direction:column;gap:14px}
  .disk-scroll{overflow:auto;padding-right:4px}
  .grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .sys-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,12fr);gap:14px;align-items:start}
  .sys-grid .card{min-width:0;box-sizing:border-box;display:flex;flex-direction:column}
  .sys-grid > .sys-area-cpu{grid-column:1;grid-row:1}
  .sys-grid > .sys-area-mem{grid-column:1;grid-row:2}
  .sys-grid > .sys-area-netlive{grid-column:1;grid-row:3}
  .sys-grid > .sys-area-disk{grid-column:2;grid-row:1 / span 4}
  .sys-grid > .sys-area-gpu{grid-column:1;grid-row:4}
  /* 系统资源页显卡卡片：精简为 温度 + 显存占用（避免多指标卡拥挤） */
  .gpu-block{display:flex;flex-direction:column;gap:6px}
  .gpu-name{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gpu-arch{font-size:11px;font-weight:400;color:var(--muted);margin-left:4px}
  .gpu-legend{display:flex;gap:16px;font-size:11px;color:var(--muted)}
  .gpu-legend-item{display:flex;align-items:center;gap:5px}
  .gpu-dot{width:10px;height:3px;border-radius:2px;display:inline-block}
  .gpu-dot.temp{background:var(--orange)}
  .gpu-dot.mem{background:var(--blue)}
  .gpu-combo{width:100%}
  .gpu-combo canvas{width:100%;height:90px;display:block}
  .gpu-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
  .gpu-head-row h3{margin:0}
  .gpu-select{font-size:12px;padding:3px 6px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--fill);color:var(--text-1);max-width:62%;cursor:pointer}
  .detect-title{font-size:16px;font-weight:500;margin-bottom:2px;color:var(--text-1)}
  .detect-sub{font-size:13px;color:var(--text-3);margin-bottom:14px}
  /* ===== hero 横幅（对齐飞牛虚拟机概览页）===== */
  .hero{background:var(--c-card);border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.05);border-radius:var(--r-md);padding:20px 24px;margin-bottom:16px;color:#1f2329;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--glow-brand)}
  .hero-head{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1;flex-wrap:nowrap;min-height:54px}
  .hero-left{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;overflow:hidden}
  .hero-text{min-width:0}
  .hero-right{display:inline-flex;align-items:center;gap:8px;flex:none;flex-wrap:nowrap}
  .hero-ic{width:52px;height:52px;flex:none;border-radius:var(--r-md);background:transparent;border:1px solid transparent;box-shadow:none;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1}
  .hero-title{font-size:18px;font-weight:500;color:#1f2329;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-sub{font-size:12px;color:#646a73;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--tint-brand-14);border-radius:var(--r-round);padding:5px 12px;font-size:12px;color:var(--link);white-space:nowrap;flex-shrink:0}
  .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80}
  .hero-badge.warn .dot{background:#FDE047}
  .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:18px;position:relative;z-index:1}
  .hs{background:var(--tint-brand-06);border:1px solid rgba(0,0,0,.05);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:78px;text-align:center}
  .hs-v{font-size:28px;font-weight:600;color:#1f2329;line-height:1.15;white-space:nowrap;text-align:center}
  .hs-v small{font-size:13px;font-weight:500;opacity:.7;margin-left:3px}
  .hs-k{font-size:13px;color:#646a73;margin-top:5px;font-weight:500;text-align:center}
  .hs-uptime .hs-v{white-space:normal;word-break:break-all;font-size:20px;line-height:1.25}
  .hs.bad .hs-v{color:#E5484D;background:var(--tint-err2-12);padding:1px 8px;border-radius:6px;display:inline-block}
  .hs.warn .hs-v{color:#B45309;background:var(--tint-warn2-12);padding:1px 8px;border-radius:6px;display:inline-block}
  /* 网络卡：与下方 sys-area-netlive 同款 grid 写法；inline-grid 在 .hs-v(text-align:center) 内居中，
     不嵌套 flex，从根上避免任何跳动。颜色与字号由 netVal 内联样式控制。 */
  .hs.net .hs-v{font-size:22px;line-height:1.3;padding:2px 0}
  /* 暗色主题：hero 用和页面卡片一致的深色卡，只留一条飞牛蓝左边条做标识，不再用高饱和蓝渐变 */
  [data-theme="dark"] .hero{background:var(--c-card);border:1px solid var(--c-border);box-shadow:var(--c-shadow);border-left:3px solid var(--c-primary);color:var(--c-text-0)}
  [data-theme="dark"] .hero::after{display:none}
  [data-theme="dark"] .hero-title{color:var(--c-text-0)}
  [data-theme="dark"] .hero-sub{color:var(--c-text-1)}
  [data-theme="dark"] .hero-badge{background:var(--c-fill-2);color:var(--c-text-0)}
  [data-theme="dark"] .hero-action .btn-mini{background:var(--c-fill-2);border-color:transparent;color:var(--c-text-0)}
  [data-theme="dark"] .hero-action .btn-mini:hover{background:var(--c-fill-1);color:var(--c-primary-hover)}
  [data-theme="dark"] .hero-ctrls .hd-time{color:var(--c-text-1)}
  [data-theme="dark"] .hero-ctrls .icon-btn{color:var(--c-text-0);border-color:var(--c-border)}
  [data-theme="dark"] .hero-ctrls .icon-btn:hover{background:var(--c-fill-2);color:var(--c-text-0)}
  [data-theme="dark"] .hero-switch{color:var(--c-text-0)}
  [data-theme="dark"] .hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);box-shadow:0 1px 2px rgba(0,0,0,.22)}
  [data-theme="dark"] .hero-head{border-bottom:1px solid rgba(255,255,255,.07);padding-bottom:14px;margin-bottom:0}
  [data-theme="dark"] .hs-v{color:var(--c-text-0)}
  [data-theme="dark"] .hs-k{color:var(--c-text-1)}
  [data-theme="dark"] .hs.bad .hs-v{color:#FCA5A5;background:rgba(248,113,113,.16);padding:1px 8px;border-radius:6px;display:inline-block}
  [data-theme="dark"] .hs.warn .hs-v{color:#FCD34D;background:rgba(245,158,11,.16);padding:1px 8px;border-radius:6px;display:inline-block}
  [data-theme="dark"] .tab.active{background:var(--c-primary-bg);color:var(--c-primary);box-shadow:var(--c-shadow);border-left:3px solid var(--c-primary)}
  .hero-action{display:inline-flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:flex-end}
  .hero-action .btn-mini{background:var(--tint-brand-14);border-color:transparent;color:var(--link)}
  .hero-action .btn-mini:hover{background:var(--tint-brand-24);color:var(--link-hover)}
  .hero-ctrls{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end}
  .hero-ctrls .hd-time{color:#646a73;font-size:12px;margin-right:2px;white-space:nowrap}
  .hero-ctrls .icon-btn{color:#646a73;border-color:rgba(0,0,0,.12)}
  .hero-ctrls .icon-btn:hover{background:rgba(0,0,0,.05);color:#1f2329}
  .hero-ctrls .switch{color:#646a73;font-size:12px;gap:5px}
  .hero-ctrls .switch .slider{background:rgba(0,0,0,.18)}
  [data-theme="dark"] .hero-ctrls .switch{color:#fff}
  [data-theme="dark"] .hero-ctrls .switch .slider{background:rgba(255,255,255,.25)}
  .hero-ctrls .switch input:checked+.slider{background:var(--success)}
  /* 风扇接管总开关（hero 内开关） */
  .hero-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:#1f2329;user-select:none}
  .hero-switch input{position:absolute;opacity:0;width:0;height:0}
  .hero-switch-track{position:relative;width:38px;height:20px;border-radius:999px;background:rgba(0,0,0,.18);transition:.2s;flex:none}
  [data-theme="dark"] .hero-switch-track{background:rgba(255,255,255,.25)}
  .hero-switch-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .hero-switch input:checked + .hero-switch-track{background:#4ADE80}
  .hero-switch input:checked + .hero-switch-track .hero-switch-knob{left:20px}
  .hero-switch-txt{white-space:nowrap}
  /* 接管关闭后锁定的风扇面板 */
  .fan-locked .fan-grid,.fan-locked .fan-presets,.fan-locked .fan-rule-tip{pointer-events:none;opacity:.5;filter:grayscale(.35)}
  .fan-locked .seg-btn,.fan-locked .fan-slider,.fan-locked .preset-btn,.fan-locked .btn-mini{pointer-events:none}
  .fan-lock-banner{margin:0 0 14px;padding:10px 14px;border-radius:var(--r-md);background:var(--c-fill-1);border:1px solid var(--border);color:var(--text-2);font-size:13px;line-height:1.6}
  /* 收编散落的静态 inline style */
  .span-2{grid-column:span 2}
  .span-all{grid-column:1/-1}
  .scroll-x{overflow-x:auto}
  .note{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.7}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .w52{width:72px;padding:4px 6px;font-size:14px;line-height:1.4}
  .detect-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mem-slots{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .mem-slot{flex:1;min-width:96px;border-radius:10px;padding:10px;border:1px solid var(--border);background:var(--bg)}
  .mem-slot.filled{border-color:var(--blue);background:#eff4ff}
  .mem-slot .ms-ch{font-size:11px;color:var(--muted);margin-bottom:4px}
  .mem-slot .ms-size{font-size:14px;font-weight:600;color:var(--text)}
  .mem-slot .ms-info{font-size:11px;color:var(--muted);margin-top:3px}
  .temp-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:6px}
  .temp-chip{border-radius:10px;padding:10px 12px;border:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;gap:4px}
  .temp-chip .tc-name{font-size:12px;color:var(--muted);word-break:break-all}
  .temp-chip .best-tag{display:inline-block;white-space:nowrap;word-break:keep-all;font-size:10px;color:#fff;background:#16a34a;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
  .temp-chip .tc-val{font-size:16px;font-weight:600}
  .gpu-sep{height:1px;background:var(--border);margin:8px 0}
  /* 显卡卡片收纳折叠 */
  .gpu-detail{margin-top:6px;border-top:1px dashed var(--border);padding-top:6px}
  .gpu-detail summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:500;list-style:none;user-select:none;display:flex;align-items:center;gap:5px}
  .gpu-detail summary::-webkit-details-marker{display:none}
  .gpu-detail summary::before{content:"▸";display:inline-block;transition:transform .15s ease;font-size:11px}
  .gpu-detail[open] summary::before{transform:rotate(90deg)}
  .gpu-detail .detail-body{padding-top:4px}
  .gpu-detail .detail-body .kv:first-child{border-top:none}
  .disk-mini{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--divider);gap:10px}
  .disk-mini:last-child{border-bottom:none}
  .disk-locate-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--divider);gap:10px}
  .disk-locate-row:last-child{border-bottom:none}
  .disk-locate-row span{display:flex;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .cc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .cc-name{font-weight:500;min-width:140px}
  .cc-state{color:var(--muted);min-width:54px}
  .cc-bar{flex:1;min-width:80px;height:8px;background:var(--divider);border-radius:4px;overflow:hidden}
  .cc-bar-fill{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
  .cc-pct{min-width:42px;text-align:right;color:var(--muted)}
  .disk-group-title{font-size:12px;font-weight:600;color:#6b7280;margin:10px 0 4px;padding-left:2px}
  .disk-group-title:first-child{margin-top:0}
.b-sas{background:#1e40af;color:#fff}
.b-sata{background:#15803d;color:#fff}
  .ch-tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap;cursor:help}
.btn-mini.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}
.disk-test-section{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.disk-test-title{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.disk-test-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.disk-test-progress{height:8px;background:var(--fill);border-radius:4px;overflow:hidden;margin:8px 0}
.disk-test-progress-fill{height:100%;background:var(--primary);transition:width .3s}
.disk-test-msg{font-size:12px;color:var(--text-2);margin-top:6px;line-height:1.5}
.disk-test-msg.error{color:var(--danger)}
.disk-test-msg.done{color:var(--success)}
.disk-test-actions{display:flex;gap:8px;align-items:center;margin-top:8px}
/* 哨兵式扇区网格（灰=未扫 / 绿=正常 / 红=坏块 / 黄=当前扫描位置） */
.surface-grid{display:grid;grid-template-columns:repeat(80,1fr);gap:1px;margin:10px 0 4px}
.sg-cell{height:6px;border-radius:1px;background:var(--muted);opacity:.3}
.sg-cell.ok{background:#22c55e;opacity:1}
.sg-cell.bad{background:#ef4444;opacity:1}
.sg-cell.cur{background:#f59e0b;opacity:1}
.surface-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin:4px 0 8px}
.surface-legend .sg-cell{vertical-align:-1px;margin-right:4px;display:inline-block;width:12px;height:6px;opacity:1}
/* 扫描面板最小化：一行小条 */
.disk-test-min{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-2)}
.disk-test-min .pct{font-weight:700;color:var(--primary)}
/* 硬盘自检入口选项弹窗 */
.pick-opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit}
.pick-opt:hover{border-color:var(--primary)}
.pick-opt-disabled{opacity:.55;cursor:not-allowed}
.pick-opt-disabled:hover{border-color:var(--border)}
.pick-opt-t{display:block;font-size:13px;font-weight:600;color:var(--text)}
.pick-opt-d{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.5}
.pick-opt-note{display:block;font-size:11px;color:var(--danger);margin-top:2px}
.disk-info-card{background:var(--fill-0);border:1px solid var(--border)}
.disk-info-card h3{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--text-1)}
.disk-info-card .note{font-size:13px;line-height:1.8;color:var(--text-2)}
.disk-info-card .note p{margin:0 0 6px}
.disk-info-card .note p:last-child{margin-bottom:0}
.disk-info-card .safe{color:var(--success)}
.disk-info-card .warn{color:var(--danger)}
  @media(max-width:768px){
    .header{display:flex;height:48px;padding:0 16px;align-items:center;border-bottom:1px solid var(--border);background:var(--bg)}

  .fan-ctrl-wrap{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px}

  .btn-mini.danger:hover{background:#b91c1c;color:#fff;border-color:#b91c1c}
  .fan-presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px}
  .fan-presets .label{font-size:13px;color:var(--muted);margin-right:2px}
  .preset-btn{padding:8px 13px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;color:var(--text);transition:.15s}
  .preset-btn:hover{border-color:var(--blue);color:var(--blue)}
  .preset-btn.full{background:var(--red);color:#fff;border-color:var(--red)}
  .preset-btn.full:hover{opacity:.85;color:#fff}
  .preset-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 0 2px var(--glow-brand-25)}
  .preset-btn.full.active{background:var(--red);border-color:var(--red);box-shadow:0 0 0 2px var(--glow-red-25)}
  .fan-global-state{font-size:13px;color:var(--muted);margin-left:auto}
  .fan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .fan-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
  .fan-card-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .fan-card-name{font-size:14px;font-weight:600}
  .fan-label-input{flex:1 1 140px;min-width:120px;padding:5px 8px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  .fan-label-input:focus{outline:none;border-color:var(--blue)}
  .fan-label-save{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fan-volt-select{padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  .fan-volt-select:focus{outline:none;border-color:var(--blue)}
  .nic-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .nic-tab{padding:6px 14px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px;line-height:1.4}
  .nic-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .net-upd{margin-top:8px;font-size:11px;color:var(--muted);text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
  .nic-ifname{font-weight:600;font-size:14px;margin-bottom:8px;color:var(--text)}
  .nic-detail .kv:first-of-type{border-top:none;padding-top:0}
  .fan-label-state{font-size:12px;color:var(--green)}
  .volt-badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--bg);color:var(--muted);border:1px solid var(--border);margin-left:4px}
  .volt-pro{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
  .volt-pro>summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none;user-select:none}
  .volt-pro>summary::-webkit-details-marker{display:none}
  .volt-pro>summary::before{content:'▸ '}
  .volt-pro[open]>summary::before{content:'▾ '}
  .volt-pro>summary:hover{color:var(--text-1)}
  .fan-rpm{font-size:26px;font-weight:700;color:var(--blue);line-height:1.1}
  .fan-rpm small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
  .fan-hw-note{margin-top:8px;padding:6px 10px;border-radius:7px;background:var(--tint-amber-10);border:1px solid var(--tint-amber-35);font-size:12px;line-height:1.5;display:none;align-items:center;flex-wrap:wrap;gap:8px}
  /* DC(电压)调速提示：该接口用电压高低调速，低档更易停转，与 PWM 行为不同需明确告知 */
  .fan-dc-note{margin-top:8px;padding:6px 10px;border-radius:7px;background:var(--tint-cyan-10);border:1px solid var(--tint-cyan-35);font-size:12px;line-height:1.5}
  .fan-hw-sum{font-weight:600;color:var(--orange)}
  .fan-hw-toggle{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted);background:none;border:1px solid var(--border);border-radius:5px;padding:1px 7px;cursor:pointer}
  .fan-hw-toggle:hover{color:var(--orange);border-color:var(--orange)}
  .fan-hw-detail{display:none;flex-basis:100%;margin-top:6px;font-size:11px;font-weight:400;color:var(--muted);line-height:1.7}
  .fan-hw-detail b{color:var(--orange);font-weight:600}
  .fan-stop-hint{display:block;margin:3px 0 0 22px;font-size:11px;color:var(--muted);line-height:1.5}
  .dt-hint-list{margin:6px 0 0;padding-left:18px;font-size:11px;color:var(--muted);line-height:1.7}
  .dt-hint-list li{margin:0}
  .dt-hint-title{margin-top:8px;font-size:11px;font-weight:600;color:var(--text)}
  .fan-speed-bar{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;margin:10px 0 4px}
  .fan-speed-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:5px;transition:width .4s}
  .fan-pct-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .fan-pct-line b{color:var(--text)}
  .fan-card .fan-slider{margin-top:4px}
  .fan-card-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:8px}
  .fan-custom{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
  .fan-custom-input{width:56px;padding:5px 6px;font-size:13px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  .fan-custom-input:focus{outline:none;border-color:var(--blue)}
  .fan-card-state{font-size:12px;color:var(--muted)}
  /* 逐风扇温度联动控速 */
  .fan-rule{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
  .fan-rule-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .fan-rule-title{font-size:12px;font-weight:600;color:var(--text)}
  .fan-rule-src{padding:4px 6px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  .fan-rule-src:focus{outline:none;border-color:var(--blue)}
  .fan-rule-live{font-size:12px;color:var(--blue);margin-left:auto}
  .fan-rule-body{margin-top:8px}
  .fan-rule-fields{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted)}
  .fan-rule-fields span{display:inline-flex;align-items:center;gap:4px}
  .fan-rule-fields label{color:var(--muted)}
  .fan-rule-fields input{width:52px;padding:4px 5px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
  .fan-rule-fields input:focus{outline:none;border-color:var(--blue)}
  .fan-rule-actions{display:flex;align-items:center;gap:10px;margin-top:8px}
  .fan-rule-state{font-size:12px;color:var(--muted)}
  .fan-rule-state.ok{color:var(--green)}
  .fan-rule-stop{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--text);cursor:pointer}
  .fan-rule-stop input{width:auto;margin:0}
  .fan-rule-tip{font-size:12px;color:var(--muted);line-height:1.6;margin:2px 0 12px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px}
  .fan-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:6px 0 4px}
  .fan-seg-3{width:100%;max-width:360px}
  .seg-btn{flex:1;padding:6px 14px;font-size:13px;font-weight:600;border:none;background:var(--bg);color:var(--muted);cursor:pointer;transition:.15s}
  .seg-btn+.seg-btn{border-left:1px solid var(--border)}
  .seg-btn.active{background:var(--blue);color:#fff}
  .seg-btn:not(.active):hover{color:var(--blue)}
  .seg-btn.disabled{opacity:.45;cursor:not-allowed}
  .seg-btn.disabled:hover{color:var(--muted)}
  .seg-sup{font-size:9px;opacity:.6;margin-left:2px;vertical-align:super}
  .fan-mode-body{margin-top:6px}
  .fan-rule-source{display:flex;align-items:center;gap:8px;margin:6px 0 8px;font-size:13px}
  .fan-rule-source label{color:var(--muted);min-width:48px}
  .fan-rule-source select{flex:1;max-width:220px}
  .fan-rule-source .fan-rule-live{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  .fan-rule-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .fan-rule-curve-wrap{margin-top:4px}
  .fan-rule-curve{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
  .fan-rule-curve-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .sleep-panel{margin-bottom:14px}
  .sleep-panel-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 2px;font-size:14px;font-weight:600}
  .sleep-panel-toggle{font-size:14px;color:var(--muted)}
  .sleep-panel-body{padding-top:10px}
  /* 当前温度概览（紧凑单行横向 chip 流） */
  .temp-overview{margin-bottom:14px;padding:12px 14px}
  .temp-overview-head{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .temp-updated{font-size:11px;font-weight:400;color:var(--muted);margin-left:auto}
  .temp-row{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
  .temp-cat{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;width:100%;margin-top:4px;padding-top:6px;border-top:1px dashed var(--border)}
  .temp-cat:first-of-type{margin-top:8px;padding-top:0;border-top:none}
  .temp-cat-label{font-size:11px;color:var(--muted);min-width:42px;font-weight:600;align-self:center}
  /* 顶部温度概览的紧凑 chip（白名单作用域：不能影响温度墙 .temp-wall 的同名 .temp-chip，否则 nowrap 会让长测点名撑破格子） */
  .temp-overview .temp-chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font-size:12px;line-height:1.4;white-space:nowrap;min-height:34px}
  .temp-overview .temp-chip.off{opacity:.65}
  /* 温度墙格子兜底：长测点名必须换行收纳，不允许撑破 grid 列宽遮挡相邻卡片 */
  .temp-wall .temp-chip{min-width:0;white-space:normal;overflow-wrap:anywhere;align-items:center;text-align:center}
  .temp-wall .temp-chip .tc-name,.temp-wall .temp-chip .tc-val{width:100%;text-align:center}
  .temp-chip-name{color:var(--muted);font-variant-numeric:tabular-nums}
  .temp-chip-val{font-weight:700;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
  .temp-chip-tag{font-size:10px;padding:1px 5px;border-radius:6px;line-height:1.3}
  .temp-chip-tag.off{color:var(--blue);background:var(--tint-blue-12)}
  .temp-chip-tag.on{color:var(--muted);background:#fff;border:1px solid var(--border)}
  .temp-chip-empty{font-size:12px;color:var(--muted);padding:4px 0}
  /* 风扇曲线编辑器：横向自适应（节点放成表格，单元更紧凑） */
  .curve-pt-table{width:100%;border-collapse:collapse;font-size:12px}
  .curve-pt-table th{font-weight:500;color:var(--muted);padding:3px 4px;text-align:left;border-bottom:1px solid var(--border)}
  .curve-pt-table td{padding:4px 4px;border-bottom:1px dashed var(--divider);vertical-align:middle}
  .curve-pt-table tr:last-child td{border-bottom:none}
  .curve-pt-num{color:var(--muted);text-align:center;width:24px;font-variant-numeric:tabular-nums}
  .curve-pt-input{display:inline-flex;align-items:stretch;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden}
  .curve-pt-input input{width:52px;padding:4px 6px;font-size:12px;border:none;background:transparent;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
  .curve-pt-input input:focus{outline:none;background:#eff6ff}
  .curve-pt-input .unit{padding:4px 6px;font-size:11px;color:var(--muted);background:var(--bg);border-left:1px solid var(--border);min-width:22px;text-align:center}
  .curve-pt-del{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:12px}
  .curve-pt-del:hover{color:var(--red);border-color:var(--tint-err-40)}
  .curve-canvas{width:100%;height:120px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-top:8px;display:block}
  /* 硬盘温度控制风扇面板 */
  .dt-panel{--dt-gap:16px;padding:18px}
  .dt-panel h3{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:16px}
  .dt-section{margin-bottom:18px}
  .dt-section-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .dt-section-title .count{font-size:11px;color:var(--blue);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border)}
  .dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .dt-hint{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:6px;padding:8px 12px;margin-bottom:12px}
  .dt-hint b{color:var(--text);font-weight:600}
  .dt-opt{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s}
  .dt-opt:hover{border-color:var(--blue)}
  .dt-opt input[type=checkbox]{margin:0;margin-top:2px;accent-color:var(--blue);flex-shrink:0}
  .dt-opt .dt-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .dt-opt .dt-name{font-size:13px;font-weight:500;color:var(--text);word-break:break-all;line-height:1.35}
  .dt-opt .dt-meta{font-size:11px;color:var(--muted);white-space:normal;word-break:break-word;line-height:1.4}
  .dt-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px;background:var(--bg);border:1px dashed var(--border);border-radius:8px}
  .dt-thresholds{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .dt-field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
  .dt-field label{font-size:13px;color:var(--muted);margin:0;min-width:64px}
  .dt-field input[type=number]{width:64px;padding:5px 7px;font-size:14px;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
  .dt-field input[type=number]:focus{outline:none;border-color:var(--blue)}
  .dt-field .unit{font-size:12px;color:var(--muted)}
  .dt-options{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .dt-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
  .dt-save-state{font-size:13px;color:var(--muted)}
  .dt-save-state.ok{color:var(--green)}
  .dt-warn{display:none;margin:8px 0;padding:10px 12px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px;line-height:1.55}
  .dt-live{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;font-size:13px}
  .dt-live b{font-size:16px;color:var(--green)}
  .dt-toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer}
  .dt-toggle input{accent-color:var(--blue);flex-shrink:0}
  .dt-toggle .num-stepper{display:inline-flex;align-items:center;gap:2px;flex-shrink:0}
  .dt-toggle .num-stepper input{width:44px;padding:4px 2px;font-size:14px;line-height:1.4;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);-moz-appearance:textfield;appearance:textfield}
  .dt-toggle .num-stepper input::-webkit-inner-spin-button,.dt-toggle .num-stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .dt-toggle .num-stepper .ns-btn{width:24px;height:26px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;line-height:1;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;user-select:none;padding:0}
  .dt-toggle .num-stepper .ns-btn:hover{border-color:var(--blue);color:var(--blue)}
  .dt-toggle .num-stepper .ns-btn:active{transform:scale(.94)}
  /* 检测新版本横幅 */
  .update-banner{display:none;align-items:center;justify-content:space-between;gap:14px;background:linear-gradient(135deg,#ea580c,#f59e0b);color:#fff;padding:11px 18px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(234,88,12,.28);font-size:14px}
  .update-banner.show{display:flex}
  .update-banner a{color:#fff;text-decoration:underline;font-weight:700;white-space:nowrap}
  .update-banner .ub-close{background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;border-radius:6px;padding:3px 11px;font-size:13px}
  .update-banner .ub-close:hover{background:rgba(255,255,255,.35)}
  /* 历史趋势时间范围切换 */
  .seg{display:inline-flex;gap:6px;margin:2px 0 4px}
  .seg-btn{background:var(--bg);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.15s}
  .seg-btn:hover{color:var(--text)}
  .seg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* 告警横幅 */
  .alert-banner{display:none;align-items:flex-start;gap:12px;background:linear-gradient(135deg,#b91c1c,#ef4444);color:#fff;padding:11px 18px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(185,28,28,.28);font-size:14px;line-height:1.6}
  .alert-banner.show{display:flex}
  .alert-banner .ab-close{background:rgba(255,255,255,.22);border:none;color:#fff;cursor:pointer;border-radius:6px;padding:3px 11px;font-size:13px;margin-left:auto}
  .alert-banner .ab-list{margin:0;padding-left:18px}
  /* 控制与自动化（浅色主题，与全站 .card / .dt-field 一致） */
  .auto-head,.manual-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .auto-head h2,.manual-head h2{margin:0;font-size:18px;color:var(--text)}
  .auto-head .auto-sub,.manual-head .auto-sub{font-size:12px;color:var(--muted);margin-top:3px}
  /* 操作手册：右侧可自动隐藏的目录（抽屉式，不挤占正文） */
  .man-layout{display:block}
  .man-content{width:100%}
  /* 目录面板：固定在右侧中部，可滑入/滑出 */
  .man-toc{position:fixed;top:50%;right:38px;transform:translateY(-50%);z-index:40;
    width:212px;max-height:74vh;overflow:auto;
    background:var(--card);border:1px solid var(--border);border-right:none;
    border-radius:14px 0 0 14px;padding:14px 12px;box-shadow:-3px 3px 14px rgba(0,0,0,.10);
    transition:transform .25s ease,opacity .25s ease}
  .man-toc.collapsed{transform:translateY(-50%) translateX(120%);opacity:0;pointer-events:none}
  .man-toc-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;padding:0 6px}
  .man-toc ul{list-style:none;margin:0;padding:0}
  .man-toc li{margin:1px 0;line-height:1.45}
  .man-toc li.lv3{padding-left:12px}
  .man-toc a{display:block;color:var(--text);text-decoration:none;font-size:13px;padding:4px 6px;border-radius:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .man-toc a:hover{background:var(--fill);color:var(--primary)}
  /* 右侧常驻的「目录」开关按钮（竖向标签） */
  .man-toc-btn{position:fixed;top:50%;right:0;transform:translateY(-50%);z-index:41;
    background:var(--primary);color:#fff;border:none;border-radius:12px 0 0 12px;
    padding:15px 9px;cursor:pointer;font-size:13px;letter-spacing:.14em;
    writing-mode:vertical-rl;box-shadow:-2px 2px 8px rgba(0,0,0,.16)}
  .man-toc-btn:hover{filter:brightness(1.06)}
  @media(max-width:820px){
    .man-toc{width:172px;max-height:66vh}
    .man-toc-btn{padding:12px 7px;font-size:12px}
  }
  /* 当前版本段：版本号匹配 APP_VERSION 时由前端整体标红（不止标题） */

  [data-theme="dark"] .mem-slot,[data-theme="dark"] .temp-chip,[data-theme="dark"] .fan-card,[data-theme="dark"] .fan-presets,[data-theme="dark"] .dt-field,[data-theme="dark"] .dt-opt,[data-theme="dark"] .chan,[data-theme="dark"] .dt-live,[data-theme="dark"] .fan-rule-tip,[data-theme="dark"] .fan-hw-note,[data-theme="dark"] .fan-dc-note,[data-theme="dark"] .dt-hint,[data-theme="dark"] .temp-overview,[data-theme="dark"] .sleep-panel,[data-theme="dark"] .auto-card,[data-theme="dark"] .curve-pt-input,[data-theme="dark"] .fan-label-input,[data-theme="dark"] .fan-volt-select,[data-theme="dark"] .fan-rule-src,[data-theme="dark"] .fan-rule-fields input,[data-theme="dark"] .dt-field input,[data-theme="dark"] .auto-field input,[data-theme="dark"] .curve-canvas,[data-theme="dark"] .dt-toggle .num-stepper input{background:var(--fill);border-color:var(--border)}

<script>
// 2.0 明暗主题切换：明 / 暗 / 自动（跟随系统），单按钮循环切换
function getThemeMode(){
  try{var t=localStorage.getItem('nasdash_theme');if(t==='light'||t==='dark'||t==='auto')return t;}catch(e){}
  return 'auto'; // 默认跟随系统，向后兼容旧版“无设置即跟随系统”
}
// 读取飞牛系统当前明暗：飞牛把主题写在 localStorage 的 fnos-theme-mode（dark/light），
// 也会通过 iframe URL 参数 ?fnos-theme-mode=...（自己或父框架）传递；拿不到返回 null
function fnosThemeMode(){
  try{ var f=localStorage.getItem('fnos-theme-mode'); if(f==='dark'||f==='light') return f; }catch(e){}
  try{ var p=new URLSearchParams(location.search).get('fnos-theme-mode'); if(p==='dark'||p==='light') return p; }catch(e){}
  try{ if(window.parent&&window.parent!==window){ var pp=new URLSearchParams(window.parent.location.search).get('fnos-theme-mode'); if(pp==='dark'||pp==='light') return pp; } }catch(e){}
  return null;
}
// 计算“目标”明暗：auto 时优先跟随飞牛系统明暗（fnos-theme-mode），拿不到再退回浏览器系统偏好
function resolvedDark(){
  var m=getThemeMode();
  if(m==='dark') return true;
  if(m==='light') return false;
  var fn=fnosThemeMode();
  if(fn==='dark') return true;
  if(fn==='light') return false;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}
// 页面此刻真实生效的明暗（只读 data-theme），保证“当前颜色”与页面完全一致，不会自相矛盾
function currentIsDark(){
  return document.documentElement.getAttribute('data-theme')==='dark';
}
function applyTheme(){
  var dark=resolvedDark();
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  updateThemeBtn();
}
function setThemeMode(m){
  try{localStorage.setItem('nasdash_theme',m);}catch(e){}
  applyTheme();
}
function cycleTheme(){
  var order=['light','dark','auto'];
  var i=order.indexOf(getThemeMode());
  if(i<0) i=0;
  setThemeMode(order[(i+1)%order.length]);
}
// 内联 SVG 线框图标（跟随飞牛风格：stroke + currentColor，明暗自动适配）
// 单一数据源 ICONS，运行时生成 <symbol> 雪碧图，静态 HTML 与 JS 模板统一用 <use href="#i-xxx"> 引用
var ICONS = {
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>',

  plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',

  wifi:'<path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/><path d="M12 12h.01"/>',

  report:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  send:'<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/>',
  mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',

  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  clipboard:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>'
};
// 生成雪碧图（symbol），供静态 HTML 与 JS 共用，单一数据源避免重复
(function(){
  var defs='<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>';
  for(var k in ICONS){ if(Object.prototype.hasOwnProperty.call(ICONS,k)){ defs+='<symbol id="i-'+k+'" viewBox="0 0 24 24">'+ICONS[k]+'</symbol>'; } }
  defs+='</defs></svg>';
  document.head.insertAdjacentHTML('beforeend', defs);
})();
function iconSvg(name, cls){
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+name+'"/></svg>';
}
// 自动模式用专属图标（contrast 半明半暗，代表“跟随系统随时切换”），与手动浅/深区分开；当前真实深/浅只写在 title 里
function themeIcon(){
  var m=getThemeMode();
  if(m==='auto') return iconSvg('contrast');
  return m==='dark'?iconSvg('moon'):iconSvg('sun');
}
function themeTitle(){
  var m=getThemeMode();
  if(m==='auto') return '主题：跟随系统（当前'+(currentIsDark()?'深色':'浅色')+'）· 点击切换';
  return '主题：'+(m==='dark'?'深色':'浅色')+' · 点击切换';

// 本地 TCP 模式（根路径）下前缀为空，行为完全不变。无需逐个改 fetch 调用。
(function(){
  var _orig = window.fetch ? window.fetch.bind(window) : null;
  if (!_orig) return;
  var base = (location.pathname || '/').replace(/\/[^\/]*$/, '');
  window.fetch = function(u, o){
    if (typeof u === 'string' && u.charAt(0) === '/' && u.charAt(1) !== '/') {
      u = base + u;
    }
    return _orig(u, o);
  };
})();

// 当前处于激活状态的板块 id（无独立状态变量，直接从 DOM 读取，最鲁棒）
function currentTab(){ var p=document.querySelector('.panel.active'); return p?p.id:'detect'; }
// 按板块拉取 → 合并进全局 DATA → 只重渲该板块，避免每次都全量 /api/all
var PANEL_ENDPOINT={system:'/api/system', temps:'/api/system', fan:'/api/system', raid:'/api/raid', disks:'/api/disks', storage:'/api/storage', docker:'/api/docker'};
// ===================== 增量更新（避免整块 innerHTML 重建导致闪烁/滚动归位/交互态丢失）=====================
// 原理：若新旧 DOM 结构一致，只 patch 变化的文本节点与属性；结构变了（如盘位增减、容器增减）才整块重建。
function _sigChildren(node){
  const r=[];
  for(const c of node.childNodes){
    if(c.nodeType===1) r.push(c);                                   // 元素节点
    else if(c.nodeType===3 && c.nodeValue.trim()!=='') r.push(c);   // 非空文本节点
    // 注释 / 纯空白文本节点：不参与结构配对
  }
  return r;
}
function _morphAttrs(oldEl, newEl){
  const newMap={};
  for(const a of newEl.attributes) newMap[a.name]=a.value;
  for(const a of Array.from(oldEl.attributes)){           // 删除旧有、新无的属性
    if(!(a.name in newMap)) oldEl.removeAttribute(a.name);
  }
  for(const a of newEl.attributes){                        // 新增 / 更新
    if(oldEl.getAttribute(a.name)!==a.value) oldEl.setAttribute(a.name, a.value);
  }
}
// 返回 true = 结构不一致，调用方需整块重建
function _morph(oldNode, newNode){
  if(oldNode.nodeType!==newNode.nodeType) return true;
  if(oldNode.nodeType===3){ // 文本：仅值变化时改写
    if(oldNode.nodeValue!==newNode.nodeValue) oldNode.nodeValue=newNode.nodeValue;
    return false;
  }
  if(oldNode.nodeType!==1) return true; // 其它节点类型视为结构不一致
  if(oldNode.tagName!==newNode.tagName) return true;
  _morphAttrs(oldNode, newNode);
  const oc=_sigChildren(oldNode), nc=_sigChildren(newNode);
  let i=0;
  while(i<nc.length){
    if(i>=oc.length) return true;          // 新结构多出节点
    if(_morph(oc[i], nc[i])) return true;
    i++;
  }
  return oc.length!==nc.length;            // 旧结构多出节点
}
function smartUpdate(el, html){
  if(!el) return;
  const tpl=document.createElement('div');
  tpl.innerHTML=html;
  const oc=_sigChildren(el), nc=_sigChildren(tpl);
  if(!oc.length || oc.length!==nc.length){ el.innerHTML=html; return; } // 首次或结构变化 → 全量
  for(let i=0;i<oc.length;i++){
    if(_morph(oc[i], nc[i])){ el.innerHTML=html; return; }              // 结构不一致 → 全量
  }
  // 结构一致：仅变化的文本/属性已被 patch，无需重建
}

async function refreshPanel(id){
  if(!DATA){ return; }  // 首屏尚未 loadData 完成时不介入
  document.querySelectorAll('.spin').forEach(spin=>spin.style.display='inline-block');
  try{
    if(id==='detect'){ // 硬件配置检测是全局概览，需要所有数据 → 走全量
      var rr=await fetchWithTimeout('/api/all?_='+Date.now(), {}, 60000); DATA=await rr.json(); renderAll(); return;
    }
    if(id==='sys-hist'){ loadHistory(); return; }
    if(id==='automation'){ if(typeof refreshAutomationAlerts==='function') refreshAutomationAlerts(); return; }
    var url=PANEL_ENDPOINT[id];
    if(!url) return;
    var r=await fetch(url+'?_='+Date.now());
    var d=await r.json();
    if(!d || d.error) return;
    if(d.system!==undefined) DATA.system=d.system;
    if(d.raid!==undefined) DATA.raid=d.raid;
    if(d.disks!==undefined) DATA.disks=d.disks;
    if(d.storage!==undefined) DATA.storage=d.storage;
    if(d.docker!==undefined) DATA.docker=d.docker;
    if(d.time) DATA.time=d.time;
    if(d.elapsed!==undefined) DATA.elapsed=d.elapsed;
    renderPanel(id);
  }catch(e){}
  finally{ document.querySelectorAll('.spin').forEach(spin=>spin.style.display='none'); }
}
// ===================== Docker 页专属更快刷新 =====================
// 全站自动刷新是 30s 节流（省资源），但 Docker 资源占用需更跟手，故给 docker tab 单独起一个 8s 定时器。
// 规则：仅当自动刷新开启「且」当前在 docker tab 时才跑；离开 docker 或关自动刷新即停。
var dockerTimer = null;
function startDockerTimer(){
  if(!autoRefreshEnabled) return;            // 跟随自动刷新开关
  if(currentTab() !== 'docker') return;      // 只在 Docker 页活跃时刷
  if(dockerTimer) return;                    // 避免重复起
  dockerTimer = setInterval(function(){ refreshPanel('docker'); }, 8000);
}
function stopDockerTimer(){
  if(dockerTimer){ clearInterval(dockerTimer); dockerTimer = null; }
}
// 只重渲指定板块（不碰其他面板 DOM）
function renderPanel(id){
  if(!DATA || DATA.error) return;
  if(id==='raid'){ smartUpdate(document.getElementById('raid'), renderRaid(DATA.raid, DATA.disks)); }
  else if(id==='disks'){ smartUpdate(document.getElementById('disks'), renderDisks(DATA.disks)); }
  else if(id==='system'){ smartUpdate(document.getElementById('system'), renderSystem(DATA.system)); }
  else if(id==='temps'){ smartUpdate(document.getElementById('temps'), renderTemps(DATA.system)); }
  else if(id==='storage'){ smartUpdate(document.getElementById('storage'), renderStorage(DATA.storage)); }
  else if(id==='docker'){ smartUpdate(document.getElementById('docker'), renderDocker(DATA.docker)); }
  else if(id==='fan'){
    // 方案 A：风扇页不再参与 30s 自动刷新的整页重建——它的实时数据（转速/温度/徽标/接管状态）
    // 已由 fetchFanStatus(1s)、fetchTemps(5s)、refreshFanControlState() 就地更新，30s 整页重载
    // 只会造成页面每 30s 闪一下、打断正在编辑的滑块/曲线（曾用户反馈「风扇页不停刷新」）。
    // 风扇标注/隐藏/曲线等配置变更都是用户操作时即时触发 loadData 或局部刷新，不依赖 30s 重载。
    // 注意：fetchFanStatus 内部仍用 isFanPanelBusy() 决定是否覆盖徽标，故该函数保留。
  }
  if(DATA.time){
    document.querySelectorAll('.lastUpdate').forEach(lu=>{ lu.textContent='更新于 '+DATA.time+(DATA.elapsed!==undefined?' ('+DATA.elapsed+'s)':''); });
  }
}

  if(pct>0.75) return 'var(--orange)';
  return 'var(--green)';
}

function renderRaid(r, disks){

  if(r.mode === 'none'){
    return panelHero({icon:ICON_RAID,title:'阵列卡',sub:'MegaRAID / HBA 控制器与物理盘',badge:{ok:false,text:'未配置'},stats:[{v:'未配置',k:'控制器状态',cls:'warn'},{v:r.model||'—',k:'型号'},{v:'—',k:'芯片温度'},{v:0,k:'物理盘数'}]})+'<div class="card"><div class="loading">'+(r.note||'未检测到阵列卡')+'</div></div>';

  }
  // HBA 直通卡（IT 模式）：盘由系统直接管理，内联 smartctl 直读的磁盘温度
  if(r.mode === 'hba'){
    let diskRows = (disks && disks.length) ? disks.map(d=>{
      let trip = d.temp_trip || 60;
      let tstr = d.temp != null ? d.temp + '°C' : 'N/A';
      let tcol = tempColor(d.temp, trip);
      let mdl = (d.vendor ? d.vendor + ' ' : '') + (d.model || '');
      let typ = d.type === 'nvme' ? 'NVMe' : (d.type === 'sas' ? 'SAS' : (d.rota === '1' ? 'SATA HDD' : 'SATA SSD'));
      return `<tr><td>${d.dev}</td><td>${mdl}</td><td>${typ}</td><td style="color:${tcol};font-weight:600">${tstr}</td></tr>`;
    }).join('') : '<tr><td colspan=4>未检测到磁盘（请用 smartctl 确认盘已被系统识别）</td></tr>';
    return `
    ${panelHero({icon:ICON_RAID,title:'阵列卡',sub:'HBA 直通 · 磁盘由系统直接管理',stats:[
      {v:'HBA 直通',k:'模式'},
      {v:(r.controller_temp!=null?r.controller_temp+'°C':'—'),k:'芯片温度'},
      {v:((disks&&disks.length)||0),k:'已识别磁盘'}
    ]})}
    <div class="cards">
      <div class="card">
        <h3>控制器 (HBA 直通)</h3>
        <div class="kv"><span class="k">型号</span><span class="v">${r.model}</span></div>
        <div class="kv"><span class="k">模式</span><span class="v"><span class="badge b-info" title="直通模式：硬盘直接交给系统管理，不做任何阵列">IT 直通</span></span></div>
        <div class="kv"><span class="k">状态</span><span class="v" style="color:var(--green)"><svg class="ico" viewBox="0 0 24 24"><use href="#i-check"/></svg> 正常工作</span></div>
        ${r.controller_temp != null ? `<div class="kv"><span class="k">芯片温度</span><span class="v" style="color:${tempColor(r.controller_temp,85)};font-weight:600">${r.controller_temp}°C</span></div>` : ''}
      </div>
      <div class="card span-2">
        <h3>说明</h3>
        <div class="note">${r.note}</div>
      </div>
    </div>
    <div class="section-title">已识别磁盘温度（smartctl 直读，无需阵列卡）</div>
    <div class="card">
      <table class="table"><thead><tr><th>设备</th><th>型号</th><th>类型</th><th>温度</th></tr></thead><tbody>${diskRows}</tbody></table>
    </div>`;
  }
  // MegaRAID (IR 模式)：现有展示逻辑
  let ct = r.controller_temp;
  let vds = (r.virtual_drives||[]).map(v=>{
    let wp = v.write_policy || '';
    let wpBadge = wp === 'WriteBack' ? '<span class="badge b-ok" title="写回：先写阵列卡缓存再刷盘，性能更好（依赖 CacheVault/电池保护）">写回 (WB)</span>'
                : (wp === 'WriteThrough' ? '<span class="badge b-info" title="直写：直接写盘，不经由阵列卡缓存，最稳">直写 (WT)</span>' : esc(v.cache_raw||'-'));
    let nm = v.name ? (esc(v.name)+' · ') : '';
    return `<tr><td>${nm}${v.dgvd}</td><td>${v.type||'-'}</td><td>${v.size||'-'}</td><td><span class="badge ${v.state==='Optl'?'b-ok':'b-warn'}">${v.state||'-'}</span></td><td>${v.access||'-'}</td><td>${wpBadge}</td></tr>`;
  }).join('');

// 硬盘健康异常横幅：仅在「硬盘 SMART」页内展示，并给出处理引导（不再进全局告警横幅）
function diskHealthWarning(disks){
  var bad = (disks||[]).filter(function(d){ return d.health_ok===false; });
  if(!bad.length) return '';
  var items = bad.map(function(d){
    return '<li><b>'+esc(d.dev)+'</b>（'+esc(d.model||'未知型号')+'）：SMART 健康状态 <b style="color:var(--red)">'+esc(d.health||'异常')+'</b></li>';
  }).join('');
  return '<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:14px 16px;margin-bottom:14px">'
    + '<div style="font-weight:600;color:#b91c1c;margin-bottom:6px">⚠️ 检测到 '+bad.length+' 块硬盘健康异常</div>'

    + '<div style="font-size:13px;color:var(--text)">建议：<b>尽快备份</b>这块盘上的重要数据，并准备更换硬盘；在换新盘之前，避免往它上面写入关键文件。</div>'

}

        <div class="kv"><span class="k" title="${esc(smartTip('待处理缺陷'))}">待处理缺陷</span><span class="v" style="color:${d.pending>0?'var(--orange)':'var(--text)'}">${d.pending}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('非介质错误'))}">非介质错误</span><span class="v">${d.non_medium_errors||0}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('读错误(不可纠正)'))}">读错误(不可纠正)</span><span class="v">${d.read_errors}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('写错误(不可纠正)'))}">写错误(不可纠正)</span><span class="v">${d.write_errors}</span></div>`;
    } else if(isNVMe) {
      detail = `
        <div class="kv"><span class="k" title="${esc(smartTip('已用时长'))}">已用时长</span><span class="v">${fmtHours(d.power_on_hours)}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('已用寿命'))}">已用寿命</span><span class="v" style="color:${d.percentage_used>0?'var(--orange)':'var(--text)'}">${d.percentage_used!=null?d.percentage_used+'%':'N/A'}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('剩余备用'))}">剩余备用</span><span class="v">${d.available_spare!=null?d.available_spare+'%':'N/A'}</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('临界告警'))}">临界告警</span><span class="v" style="color:${ (parseInt(d.critical_warning||'0',16)||0)>0 ? 'var(--red)' : 'var(--green)' }">${ (parseInt(d.critical_warning||'0',16)||0)>0 ? ('0x'+d.critical_warning+' 告警') : '正常' }</span></div>
        <div class="kv"><span class="k" title="${esc(smartTip('读取量'))}">读取量</span><span class="v">${d.data_units_read||'N/A'}</span></div>

      detail = `

      </div>
      <div class="kv"><span class="k" title="${esc(smartTip('型号'))}">型号</span><span class="v">${d.model?(d.brand?d.brand+' ':'')+(d.vendor?d.vendor+' ':'')+d.model:'—'}</span></div>
      <div class="kv"><span class="k" title="${esc(smartTip('容量 / 类型'))}">容量 / 类型</span><span class="v">${d.size} · ${isNVMe?'NVMe':(isSAS?'SAS':'SATA')} · ${d.rota=='1'?'HDD':'SSD'}${diskFeatureClean(d.feature,d.dual_actuator)?' · '+esc(diskFeatureClean(d.feature,d.dual_actuator)):''}</span></div>
      <div class="kv"><span class="k" title="${esc(smartTip('转速'))}">转速</span><span class="v">${d.rpm||(d.rota=='1'||isSAS?'—':'固态(SSD)')}</span></div>

  }).join('')+'</div>';
}

// ===== 硬盘自检（A/B 双档）前端 =====
var DISK_TEST_JOBS = {};
var diskTestTimer = null;      // 本地 1 秒 elapsed 计时器
var diskTestPollTimer = null;  // 后端 3 秒状态轮询计时器
function fmtSec(s){ if(s==null) return '-'; var n=Math.round(s); if(n<60) return n+'秒'; var m=Math.floor(n/60), h=Math.floor(m/60); m=m%60; if(h) return h+'小时'+m+'分'; return m+'分'+(n%60)+'秒'; }
function fmtBytes(b){ if(!b) return '0'; var u=['B','KB','MB','GB','TB','PB'],i=0; while(b>=1024&&i<u.length-1){ b/=1024; i++; } return (b>=100?Math.round(b):Math.round(b*10)/10)+u[i]; }
function renderDiskTest(d){
  var job = (DISK_TEST_JOBS || {})[d.dev];
  if(job && job.state === 'running'){
    var pct = job.progress!=null ? Math.min(100, Math.round(job.progress)) : 0;
    var prog = job.progress!=null
      ? '<div class="disk-test-progress"><div class="disk-test-progress-fill" style="width:'+pct+'%"></div></div>'
        + '<div class="disk-test-pct" style="text-align:right;font-size:12px;color:var(--primary);font-weight:600;margin-top:3px">'+pct+'%</div>'
      : '';
    var elapsedNow = job.started_at ? Math.max(0, Math.floor(Date.now()/1000 - job.started_at)) : (job.elapsed || 0);
    var etaHtml = '';
    if(job.started_at){
      if(job.progress!=null && job.progress>0){
        var _total = elapsedNow * 100 / job.progress;
        var _remain = Math.max(0, _total - elapsedNow);
        etaHtml = ' · 预计剩余 <span id="dt-eta-'+esc(d.dev)+'">'+fmtSec(_remain)+'</span> / 总用时约 '+fmtSec(_total);
      }else{
        var hint = job.eta_total_hint ? '参考总用时约 '+fmtSec(job.eta_total_hint) : '刚开始，进度更新较慢';
        etaHtml = ' · 预计剩余 <span id="dt-eta-'+esc(d.dev)+'">计算中…</span>（'+hint+'）';
      }
    }
    // 最小化：只留一行小条（盘名 + 进度），后台继续扫，可随时展开
    if(diskTestMin[d.dev]){
      return '<div class="disk-test-section disk-test-min">'
        +iconSvg('pulse')+'硬盘自检 <b>'+esc(d.dev)+'</b> · '+esc(jobTypeName(job.type))+' <span class="pct" id="dt-minpct-'+esc(d.dev)+'">'+pct+'%</span>'
        +'<button class="btn-mini" onclick="toggleDiskTestMin(\''+esc(d.dev)+'\',false)">展开</button>'
        +'<button class="btn-mini" onclick="abortDiskTest(\''+esc(d.dev)+'\')">中止</button>'
        +'<span class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></span>'
        +'</div>';
    }
    var isGrid = (job.type==='badblocks'||job.type==='surface');
    var gridHtml = isGrid
      ? surfaceGridHTML(d.dev, job)
        + '<div class="surface-legend">'
        + '<span><i class="sg-cell ok"></i>正常</span><span><i class="sg-cell"></i>未扫</span>'
        + '<span><i class="sg-cell bad"></i>坏块</span><span><i class="sg-cell cur"></i>扫描位置</span></div>'
      : '';
    return '<div class="disk-test-section">'
      +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检 · '+esc(jobTypeName(job.type))+' · '+esc(d.dev)
      +'<button class="btn-mini" style="margin-left:auto" onclick="toggleDiskTestMin(\''+esc(d.dev)+'\',true)" title="收起面板，后台继续扫描">最小化</button></div>'
      +'<div class="disk-test-msg">'+esc(job.message)+' · 已运行 <span id="dt-elapsed-'+esc(d.dev)+'">'+fmtSec(elapsedNow)+'</span>'+etaHtml+'</div>'
      +prog
      +gridHtml
      +'<div class="disk-test-actions"><button class="btn-mini" onclick="abortDiskTest(\''+esc(d.dev)+'\')">中止</button><span class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></span></div>'
    +'</div>';
  }
  if(job && (job.state === 'done' || job.state === 'error' || job.state === 'aborted')){
    var cls = job.state==='done'?'done':(job.state==='error'?'error':'');
    var result = '';
    if(job.result && job.result.read_errors!==undefined){
      result = ' · 读错误 '+job.result.read_errors+' / 写错误 '+job.result.write_errors+' / 可纠正 '+job.result.corrected;
    }
    if(job.bad_blocks && job.bad_blocks.length){
      result += ' · <b style="color:var(--danger)">坏块 '+job.bad_blocks.length+' 个</b>';
    }
    return '<div class="disk-test-section">'
      +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检 · '+(job.state==='done'?'完成':(job.state==='error'?'失败':'中止'))+'</div>'
      +'<div class="disk-test-msg '+cls+'">'+esc(job.message)+result+'</div>'
      +'<div class="disk-test-actions"><button class="btn-mini" onclick="clearDiskTest(\''+esc(d.dev)+'\')">清除</button></div>'
    +'</div>';
  }
  var modelArg = esc(d.model || '未知型号').replace(/'/g,"\\'");
  return '<div class="disk-test-section">'
    +'<div class="disk-test-title">'+iconSvg('pulse')+'硬盘自检</div>'
    +'<div class="disk-test-btns">'
      +'<button class="btn-mini" onclick="diskTestEntry(\''+esc(d.dev)+'\',\''+(d.standalone?'1':'0')+'\',\''+modelArg+'\')">硬盘自检</button>'
      +'<button class="btn-mini" onclick="showDiskTestHistory(\''+esc(d.dev)+'\')">自检记录</button>'
    +'</div>'
    +'<div class="disk-test-msg" id="dt-state-'+esc(d.dev)+'"></div>'
  +'</div>';
}
// 硬盘自检历史记录：点击「自检记录」按钮弹出历史列表（复用 app-modal）
function showDiskTestHistory(dev){
  var modal=document.getElementById('app-modal');
  var titleEl=document.getElementById('app-modal-title');
  var bodyEl=document.getElementById('app-modal-body');
  var actionsEl=document.getElementById('app-modal-actions');
  if(!modal||!titleEl||!bodyEl||!actionsEl){ alert('弹窗组件未就绪'); return; }
  function cleanup(){
    modal.classList.remove('show'); modal.classList.remove('modal-wide');
    modal.setAttribute('aria-hidden','true');
    document.removeEventListener('keydown', onKey);
    modal.onclick=null;
  }
  function onKey(e){ if(e.key==='Escape') cleanup(); }
  titleEl.textContent='硬盘自检记录'+(dev?' · /dev/'+dev:'');
  bodyEl.innerHTML='<div class="log-empty">加载中…</div>';
  actionsEl.innerHTML='';
  modal.classList.add('modal-wide');
  modal.classList.add('show');
  modal.setAttribute('aria-hidden','false');
  document.addEventListener('keydown', onKey);
  modal.onclick=function(e){ if(e.target===modal) cleanup(); };
  var closeBtn=document.createElement('button');

    var hist=(j&&j.history)||[];
    if(!hist.length){ bodyEl.innerHTML='<div class="log-empty">暂无自检记录</div>'; return; }
    var rows=hist.map(function(h){
      var st=h.state==='done'?'<span style="color:var(--success)">完成</span>'
        :(h.state==='error'?'<span style="color:var(--danger)">失败</span>'
        :'<span style="color:var(--warn)">中止</span>');
      var t=h.type==='surface'?'只读表面扫描':(h.type==='badblocks'?'坏块慢扫':'SMART 长自检');
      var bb=h.bad_blocks>0?'<span style="color:var(--danger)">坏块 '+h.bad_blocks+'</span>':'坏块 0';
      // 说明：单行紧凑（容量+速率 / 坏块位置 / SMART 前后对比 / 错误细分）；全部内容放 title 悬停看
      var segs=[];   // 显示行（单行拼接，空格分隔）
      var tips=[];   // title 全文（每段一行）
      if(h.total_bytes){
        var speed=Math.round(h.total_bytes / Math.max(1, h.elapsed||0) / 1048576);
        var cap='扫描 '+fmtBytes(h.total_bytes)+(speed?' · 平均 '+speed+'MB/s':'');
        segs.push(cap); tips.push(cap);
      }
      if(h.bad_lbas && h.bad_lbas.length){
        var bbTxt='坏块 '+h.bad_blocks+' · LBA '+h.bad_lbas.join(', ')+(h.bad_blocks>20?' …':'');
        segs.push('<span style="color:var(--danger)">'+bbTxt+'</span>');
        tips.push(bbTxt);
      }
      function _deltaItem(b,a,name){
        if(b==null && a==null) return null;
        var bv=b==null?'-':b, av=a==null?'-':a;
        var chg=(b!=null && a!=null && a!==b);
        var val=name+' '+bv+(chg?'→'+av+' ('+(a>b?'+':'')+(a-b)+')':'='+av);
        return {text:val, changed:chg};
      }
      var sb=h.smart_before||{}, sa=h.smart_after||{};
      [_deltaItem(sb[5],sa[5],'重映射'),_deltaItem(sb[197],sa[197],'待处理'),_deltaItem(sb[198],sa[198],'不可校正')]
        .forEach(function(x){ if(x){ segs.push(x.changed?'<span style="color:var(--danger)">'+x.text+'</span>':'<span style="color:var(--text-3)">'+x.text+'</span>'); tips.push(x.text); }});
      if(h.result && h.result.read_errors!==undefined && (h.result.read_errors!=='0'||h.result.write_errors!=='0'||h.result.corrected!=='0')){
        var rTxt='读错 '+h.result.read_errors+'/写错 '+h.result.write_errors+'/纠正 '+h.result.corrected;
        segs.push(rTxt); tips.push(rTxt);
      }
      var descTxt=segs.length?segs.join(' · '):esc(h.message||'');
      var descTitle=tips.length?tips.join('\n'):(h.message||'');
      var ts=new Date((h.finished_at||0)*1000);
      var timeStr=isNaN(ts.getTime())?'-':(ts.getFullYear()+'-'+String(ts.getMonth()+1).padStart(2,'0')+'-'+String(ts.getDate()).padStart(2,'0')+' '+String(ts.getHours()).padStart(2,'0')+':'+String(ts.getMinutes()).padStart(2,'0'));
      return '<div class="hist-row">'
        +'<b class="c1">'+esc(h.dev||'')+'</b>'
        +'<span class="c2">'+t+'</span>'
        +'<span class="c3">'+st+'</span>'
        +'<span class="c4">'+bb+'</span>'
        +'<span class="c5">'+fmtSec(h.elapsed||0)+'</span>'
        +'<span class="c6" title="'+esc(descTitle)+'">'+descTxt+'</span>'
        +'<span class="c7">'+timeStr+'</span>'
        +'</div>';
    }).join('');
    bodyEl.innerHTML='<div class="hist-head">'
      +'<b class="c1">盘</b><span class="c2">类型</span><span class="c3">结果</span>'
      +'<span class="c4">坏块</span><span class="c5">用时</span>'
      +'<span class="c6">说明</span><span class="c7">时间</span>'
      +'</div>'+rows
      +'<div class="hist-foot">仅保留最近 50 条 · 应用重启后仍可回查</div>';
  }).catch(function(e){
    bodyEl.innerHTML='<div class="log-empty">加载失败：'+esc(String(e))+'</div>';
  });
}

// 哨兵式扇区网格：灰=未扫 / 绿=正常 / 红=坏块 / 黄=当前扫描位置（80x8=640 格，每格=盘容量/640）
function surfaceGridHTML(dev, job){
  var n = 640;
  var total = job.total_bytes || 0;
  var bs = job.blocksize || 4096;
  var pct = job.progress || 0;
  var green = total>0 ? Math.floor(pct/100*n) : 0;
  var badIdx = {};
  if(total>0 && job.bad_blocks && job.bad_blocks.length){
    var spanB = total/n;
    for(var i=0;i<job.bad_blocks.length;i++){
      var idx = Math.floor(job.bad_blocks[i]*bs/spanB);
      if(idx>=0 && idx<n) badIdx[idx]=true;
    }
  }
  var cells='';
  for(var c=0;c<n;c++){
    var cls='sg-cell';
    if(badIdx[c]) cls+=' bad';
    else if(c<green) cls+=' ok';
    else if(c===green) cls+=' cur';
    cells+='<i class="'+cls+'"></i>';
  }
  return '<div class="surface-grid" id="sg-'+esc(dev)+'">'+cells+'</div>';
}
async function startDiskTest(dev,type,model){

    danger: true,
    ok: '确定执行',
    cancel: '取消'

  if(type==='surface' && !await appConfirm({
    title: '确认对 '+model+' 执行 C 档只读表面扫描？',
    body: '目标磁盘：'+model+'（/dev/'+dev+'）\n\nC 档是只读表面扫描：只读取盘面数据判断能否正常读出，不写入任何数据、不会伤盘，可用于正在用的盘/阵列成员。\n但会持续读取整块盘，耗时较长，扫描期间该盘的 IO 会被占用。',
    ok: '开始扫描',

function clearDiskTest(dev){
