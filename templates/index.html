  REPORT_GROUPS.forEach(g=>{
    const gs=items.filter(x=>g.keys.includes(x.m.key));
    if(!gs.length) return;
    md+=`## ${g.title}\n\n`;
    gs.forEach(x=>{
      const pairs=(points||[]).map(p=>({ts:p.ts, v:p[x.m.key]})).filter(p=> typeof p.v==='number' && !isNaN(p.v));
      md+=`### ${x.m.label}\n${x.nar.text}\n\n${svgChartImg(x.m, pairs)}\n\n> 趋势（${x.m.label}）：${asciiSpark(x.s.values)}\n\n`;
    });
  });
  const warns=items.filter(x=>x.nar&&x.nar.level!=='ok');
  if(warns.length){
    md+=`## 异常与建议\n\n`;
    warns.forEach(x=>md+=`- 【${x.nar.level==='danger'?'危险':'关注'}】${x.nar.text}\n`);
    md+=`\n建议：优先检查机箱风道与防尘，必要时调整风扇策略或降低负载。\n`;
  }
  return md;
}
function toHTML(range, genAt, items, overview){
  const rt={'24h':'24 小时','7d':'7 天','30d':'30 天'}[range]||range;
  const n=items.length?items[0].s.n:0;
  const ovClass=overview.level==='danger'?'danger':overview.level==='warn'?'warn':'ok';
  let body='';
  REPORT_GROUPS.forEach(g=>{
    const gs=items.filter(x=>g.keys.includes(x.m.key));
    if(!gs.length) return;
    body+=`<h2>${g.title}</h2>`;
    gs.forEach(x=>{
      const lvl=x.nar.level;
      const badge=lvl==='danger'?'<span class="badge danger">危险</span>':lvl==='warn'?'<span class="badge warn">关注</span>':'<span class="badge ok">正常</span>';
      body+=`<div class="item ${lvl}"><div class="item-h"><span class="dot" style="background:${x.m.color}"></span><b>${x.m.label}</b>${badge}</div><div class="spark">${sparkline(x.s.values,x.m.color)}</div><div class="nar">${x.nar.text}</div></div>`;
    });
  });
  const warns=items.filter(x=>x.nar&&x.nar.level!=='ok');
  let advice='';
  if(warns.length){
    advice=`<div class="block danger-block"><h2>异常与建议</h2><ul>${warns.map(x=>`<li><b>${x.m.label}：</b>${x.nar.text}</li>`).join('')}</ul><p>建议：优先检查机箱风道与防尘，必要时调整风扇策略或降低负载。</p></div>`;
  }
  const CSS=`*{box-sizing:border-box}body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2430;margin:0;padding:24px;line-height:1.6}.wrap{max-width:840px;margin:0 auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.08)}header h1{font-size:20px;margin:0 0 6px}.meta{color:#6b7280;font-size:13px}.overview{border-radius:10px;padding:14px 16px;margin:18px 0;font-size:15px}.overview.ok{background:#e9f7ef;color:#1b7f4b;border:1px solid #bfe6cf}.overview.warn{background:#fff6e6;color:#9a6a00;border:1px solid #ffe0a3}.overview.danger{background:#fdecec;color:#b42323;border:1px solid #f6c9c9}h2{font-size:16px;margin:22px 0 10px;border-left:3px solid #4aa3ff;padding-left:8px}.item{border:1px solid #eef0f3;border-radius:10px;padding:12px 14px;margin-bottom:10px}.item.danger{border-color:#f3c2c2;background:#fff7f7}.item.warn{border-color:#ffe2b0;background:#fffaef}.item-h{display:flex;align-items:center;gap:8px;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.badge{font-size:11px;padding:1px 8px;border-radius:10px;margin-left:auto}.badge.ok{background:#e9f7ef;color:#1b7f4b}.badge.warn{background:#fff6e6;color:#9a6a00}.badge.danger{background:#fdecec;color:#b42323}.spark{margin:8px 0}.nar{font-size:13px;color:#374151}.block.danger-block{background:#fff7f7;border:1px solid #f3c2c2;border-radius:10px;padding:14px 16px;margin-top:18px}.block ul{margin:8px 0;padding-left:20px}.block li{margin:4px 0;font-size:13px}footer{margin-top:24px;color:#9aa1ad;font-size:12px;text-align:center}`;
  return `<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nasdash 历史趋势分析报告</title><style>${CSS}</style></head><body><div class="wrap"><header><h1>nasdash 历史趋势分析报告</h1><div class="meta">数据区间：${rt} · 生成时间：${genAt} · 样本 ${n} 条（每 30 秒一点，自动保留 30 天）</div></header><div class="overview ${ovClass}">${overview.text}</div>${body}${advice}<footer>本报告由 nasdash 在您的 NAS 本地生成，数据未离开本机。</footer></div></body></html>`;
}
function downloadReport(filename, content, mime, bom){
  const blob=new Blob(bom?['﻿'+content]:[content], {type:mime+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function genReport(range, fmt){
  const s=document.getElementById('report-status');
  if(s) s.textContent='生成中…';
  try{
    const r=await fetch('/api/history?range='+range+'&_='+Date.now());
    const d=await r.json();
    const pts=d.points||[];
    if(pts.length<3){ alert('历史样本不足（仅 '+pts.length+' 条），无法生成有意义的分析。请让 NAS 运行更长时间后再试。'); if(s)s.textContent=''; return; }
    const items=REPORT_METRICS.map(m=>({m, s:computeStats(pts,m.key)})).filter(x=>x.s).map(x=>({m:x.m, s:x.s, nar:metricNarrative(x.m,x.s)}));
    const overview=buildOverview(items);
    const genAt=new Date().toLocaleString('zh-CN');
    let content,mime,ext,bom=false;
    if(fmt==='csv'){ content=toCSV(pts); mime='text/csv'; ext='csv'; bom=true; }
    else if(fmt==='md'){ content=toMarkdown(range,genAt,items,overview,pts); mime='text/markdown'; ext='md'; }
    else { content=toHTML(range,genAt,items,overview); mime='text/html'; ext='html'; }
    const fn=`nasdash-历史报告-${range}-${new Date().toISOString().slice(0,10)}.${ext}`;
    downloadReport(fn, content, mime, bom);
    if(s) s.textContent='已下载：'+fn;
    setTimeout(()=>{ if(s) s.textContent=''; }, 4000);
  }catch(e){ if(s) s.textContent='生成失败：'+e; }
}
function openReportModal(){ const m=document.getElementById('report-modal'); if(m) m.classList.add('show'); }
function closeReportModal(){ const m=document.getElementById('report-modal'); if(m) m.classList.remove('show'); const s=document.getElementById('report-status'); if(s) s.textContent=''; }

const CACHE_KEY = 'nasdash_all_cache_v1';
async function loadData(force){
  // 1) 先用浏览器本地缓存「秒开」界面：硬刷新也能立刻看到上一次的内容，后台静默刷新最新数据
  let usedCache = false;
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(raw){
      const obj = JSON.parse(raw);
      if(obj && obj.data){
        DATA = obj.data;
        renderAll(true);
        usedCache = true;
      }
    }
  }catch(e){ DATA = null; }
  // 2) 后台静默拉取最新全量数据，到了再无缝覆盖
  document.querySelectorAll('.spin').forEach(spin=>spin.style.display='inline-block');
  try{
    let r = await fetchWithTimeout('/api/all' + (force?'?force=1&_=':'?_=') + Date.now(), {}, 60000);
    DATA = await r.json();
    renderAll(false);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({data:DATA, savedAt:new Date().toISOString()})); }catch(e){}
    initHistory();
    loadHistory();
    pollDiskTests();
  }catch(e){
    // 有缓存就保持缓存内容并提示后台刷新失败；无缓存才显示加载失败
    if(!usedCache){
      document.querySelectorAll('.panel').forEach(p=>p.innerHTML='<div class="card"><div class="loading" style="color:var(--red)">加载失败: '+esc(String(e))+'</div></div>');
    }
    document.querySelectorAll('.lastUpdate').forEach(lu=>{ lu.textContent = (usedCache?'后台刷新失败，当前显示缓存 · ':'加载失败: ')+e; });
  }
  document.querySelectorAll('.spin').forEach(spin=>spin.style.display='none');
}

// 定时刷新只刷「当前正在看的板块」，不再每 30s 全量 /api/all
function autoRefreshTick(){ refreshPanel(currentTab()); }
// 自动刷新开关状态从 localStorage 恢复；控件渲染后由 setAutoRefresh 统一同步所有面板
autoRefreshEnabled = (localStorage.getItem('nasdash_autorefresh') === '1');
if(autoRefreshEnabled){ timer = setInterval(autoRefreshTick, 30000); }

loadData();  // 首屏仍全量拉取一次，打底填充所有板块 DATA
startNetRateTimer();  // 启动轻量实时流量刷新（每 1s 只拉 /api/metrics，不动重采集）
startSysNetTimer();  // 启动网络卡片轻量刷新（每 5s 拉独立 /api/network，不依赖 60s 缓存）
ensureTempPolling();  // 全局开启温度轮询，让检测/风扇页也用实时 CPU 温度，避免各页温度不一致

// ---------- 检测新版本 ----------
let updateDismissed = false;
async function checkUpdate(force){
  const banner = document.getElementById('updateBanner');
  if(!force && updateDismissed) return;
  if(force){
    document.querySelectorAll('.checkUpdateBtn').forEach(btn=>{ btn.disabled = true; btn.textContent = '⏳'; btn.title = '检查中…'; });
  }
  try{
    const r = await fetch('/api/version' + (force ? '?force=1' : ''));
    const d = await r.json();
    const link = document.getElementById('updateLink');
    if(d.update_available && d.latest){
      document.getElementById('updateText').innerHTML = '发现新版本 <b>'+d.latest+'</b>（当前 '+d.current+'）';
      link.href = d.url || 'https://github.com/han951meng/nasdash/releases';
      link.style.display = '';
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
      link.style.display = 'none';
      if(force){
        if(d.error){
          document.getElementById('updateText').textContent = '检查更新失败：' + d.error;
        } else {
          document.getElementById('updateText').textContent = '已是最新版本（'+d.current+'）';
        }
        banner.classList.add('show');
        if(!d.error){ setTimeout(()=>banner.classList.remove('show'), 3500); }
      }
    }
  }catch(e){
    if(force){
      document.getElementById('updateText').textContent = '检查更新出错：' + e;
      banner.classList.add('show');
    }
  }finally{
    if(force){
      document.querySelectorAll('.checkUpdateBtn').forEach(btn=>{ btn.disabled = false; btn.innerHTML = iconSvg('bell'); btn.title = '检查更新'; });
    }
  }
}
function dismissUpdate(){ document.getElementById('updateBanner').classList.remove('show'); updateDismissed = true; }

checkUpdate(false);

// 滚动条自动隐藏：不用时彻底不渲染（隐藏），滚动时才浮现，停手约 0.9s 后消失（左侧栏与页面共用）
(function(){
  function autoHide(el){
    if(!el) return;
    var t;
    el.addEventListener('scroll', function(){
      el.classList.add('scrolling');
      clearTimeout(t);
      t = setTimeout(function(){ el.classList.remove('scrolling'); }, 900);
    }, {passive:true});
  }
  autoHide(document.querySelector('.sidebar'));
  var html = document.documentElement, t2;
  window.addEventListener('scroll', function(){
    html.classList.add('scrolling');
    clearTimeout(t2);
    t2 = setTimeout(function(){ html.classList.remove('scrolling'); }, 900);
  }, {passive:true});
})();
